<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahdi Repair</title>
<link rel="stylesheet" href="common.css"><style>
html,body{height:100%;margin:0;overflow:hidden}.app{display:grid;grid-template-rows:auto auto auto 1fr auto;height:100vh;height:100dvh}
.sh-top{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:46px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:50}

.sh-m:hover>span,.sh-m:hover>a,.sh-m.open>span,.sh-m>a.on{background:color-mix(in srgb,var(--ac) 14%,transparent)}

.sh-user{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex:none}.sh-av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-weight:700;font-size:14px}.sh-who{line-height:1.15;font-size:13px;color:var(--ink)}.sh-who small{color:var(--mut);display:block}

.app.rc .sh-tabs,.app.rc .sh-ribbon{display:none}
.main{position:relative;overflow:hidden}.fr{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}.fr.on{display:block}.ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);pointer-events:none}
.sh-status{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;padding:3px 12px;font-size:12px;color:var(--mut);background:color-mix(in srgb,var(--ac) 7%,var(--card));border-top:1px solid var(--line)}
.app.focus{grid-template-rows:0 0 0 1fr 0}.app.focus .sh-top,.app.focus .sh-tabs,.app.focus .sh-ribbon,.app.focus .sh-status{display:none}
#fx{display:none;position:fixed;top:8px;inset-inline-end:12px;z-index:90;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--ink);box-shadow:0 4px 16px #0003;cursor:pointer;font-weight:600}.app.focus ~ #fx{display:block}
#mm{display:none;position:fixed;inset:48px 0 0 0;background:var(--card);overflow:auto;z-index:80;padding:8px 12px 24px}#mm.open{display:block}.mg>b{display:flex;justify-content:space-between;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}.mg .mi{display:none;padding:2px 0 6px}.mg.open .mi{display:block}.mg .mi a{display:block;padding:11px 14px;color:var(--ink);text-decoration:none;border-radius:8px}.mg .mi a:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
@media(max-width:1500px){.sh-shop{display:none}}@media(max-width:1180px){.sh-who{display:none}}
@media(max-width:900px){.sh-menubar,.sh-tabs,.sh-ribbon,.sh-who,.sh-status{display:none!important}.sh-hb{display:inline-grid!important}.sh-brand span{font-size:15px}}
html[data-skin=pme] .sh-tabs{background:#b7d1f2}html[data-skin=pme] .sh-tabs span{color:#123}html[data-skin=pme] .sh-ribbon{background:linear-gradient(#eaf3fe,#c3d9f4);border-color:#8aa}html[data-skin=pme] .sh-top{background:#f3f3f3}html[data-skin=pme] .sh-status{background:#d6e6fa}html[data-skin=pme] .sh-rib a,html[data-skin=pme] .sh-rq a{color:#0b2a66}html[data-skin=pme] .sh-shop{color:#0a2a8a}

</style></head><body>
<div class="app" id="app">

<script type="module">
if(window.self!==window.top){window.top.location.replace(location.href)}

const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">${IC[n]}</svg>`;
const MENUS=[['File',[['Settings','settings.html'],['Admin panel','admin.html'],['Customer messages','admin.html#ms'],['Demo data','seed.html']]],

 ['Additional',[['💸','Expenses','treasury.html#ex'],['🗑️','Losses','treasury.html#ls'],['🔐','Registers','treasury.html#rg'],['🧮','Daily closing','treasury.html#cl'],['📊','Statistics','statistics.html'],['💬','CRM dashboard','crm.html'],['🏅','Bonus report','techreport.html'],['📋','Stock counts','stockmgmt.html#count']]],
 ['Workshop',[['🛠️','Reception desk','reception.html'],['🧾','New quote','quotes.html'],['🔧','Technician board','technician.html'],['📦','Parts queue','partsqueue.html'],['🗂️','Storage map','locations.html']]]];

function build(){$('sn').textContent=SHOP.name;$('un').textContent=(profile&&profile.name)||user.email;$('ur').textContent=role[0].toUpperCase()+role.slice(1);$('av').textContent=(((profile&&profile.name)||user.email)[0]||'?').toUpperCase();$('s1').textContent='User: '+$('un').textContent;$('s2').textContent='Role: '+role;$('s3').textContent=SHOP.name;
 const M=MENUS.map(([n,it])=>[n,it.filter(x=>ok(x[1]))]).filter(x=>x[1].length);
 $('mb').innerHTML=(ok('dashboard.html')?`<div class="sh-m"><a data-h="dashboard.html">Dashboard</a></div>`:'')+M.map(([n,it])=>`<div class="sh-m"><span>${n}</span><div class="sh-dd">${it.map(x=>A(x[0],x[1],x[2])).join('')}</div></div>`).join('');
 $('mm').innerHTML=(ok('dashboard.html')?`<div class="mg open"><b data-h="dashboard.html">Dashboard</b></div>`:'')+M.map(([n,it])=>`<div class="mg"><b>${n}<span>›</span></b><div class="mi">${it.map(x=>A(x[0],x[1],x[2])).join('')}</div></div>`).join('');
 const R=RIB.map(([n,it])=>[n,it.filter(x=>ok(x[2]))]).filter(x=>x[1].length);
 $('tb').innerHTML=R.map(([n])=>`<span>${n}</span>`).join('');$('rb').innerHTML='<div class="sh-ribs">'+R.map(([n,it])=>`<div class="sh-rib">${it.map(x=>`<a data-h="${x[2]}" ${x[3]?'data-f="1"':''}><i>${x[0]}</i>${x[1]}</a>`).join('')}</div>`).join('')+'</div>'+`<div class="sh-shop">${(SHOP.name||'').toUpperCase()}</div><div class="sh-rq">${ok('settings.html')?'<a data-h="settings.html"><i>⚙️</i>Settings</a>':''}${ok('admin.html')?'<a data-h="admin.html"><i>🛡️</i>Admin panel</a>':''}</div>`;
 const tabs=[...$('tb').children],pan=[...$('rb').querySelectorAll('.sh-rib')],sel=i=>{tabs.forEach((t,k)=>t.classList.toggle('on',k===i));pan.forEach((p,k)=>p.classList.toggle('on',k===i))};tabs.forEach((t,i)=>t.onclick=()=>sel(i));sel(0);
 const closeAll=()=>document.querySelectorAll('.sh-m.open').forEach(m=>m.classList.remove('open'));
 if(matchMedia('(hover:none)').matches)document.querySelectorAll('.sh-m>span').forEach(s=>s.onclick=e=>{const m=s.parentElement,o=m.classList.contains('open');closeAll();if(!o)m.classList.add('open');e.stopPropagation()});
 document.addEventListener('click',closeAll);document.querySelectorAll('.sh-m').forEach(m=>m.addEventListener('mouseleave',()=>m.classList.remove('shut')));
 document.querySelectorAll('.mg>b').forEach(b=>b.onclick=()=>{if(!b.dataset.h)b.parentElement.classList.toggle('open')});
 document.querySelectorAll('[data-h]').forEach(a=>a.onclick=e=>{e.stopPropagation();const m=a.closest('.sh-m');if(m){m.classList.add('shut');m.classList.remove('open')}$('mm').classList.remove('open');show(a.dataset.h,!!a.dataset.f)});
 $('nt')&&0;app.classList.toggle('rc',localStorage.getItem('rd_rc')==='1')}
function show(href,focus){const u=new URL(href,location.href),key=u.pathname.split('/').pop(),hash=u.hash.slice(1);let f=frames[key];
 if(!f){f=document.createElement('iframe');f.name='rd:'+key;f.className='fr';f.dataset.s=u.search;f.src=key+u.search+(focus?(u.search?'&':'?')+'focus=1':'')+(hash?'#'+hash:'');f.onload=()=>{$('ld').style.display='none'};frames[key]=f;$('fm').append(f);$('ld').style.display='grid'}
 else{if(u.search!==f.dataset.s){f.dataset.s=u.search;f.src=key+u.search+(hash?'#'+hash:'')}else if(hash){try{f.contentWindow.location.hash=hash}catch(e){}}if(key==='pos.html'){try{f.contentDocument.documentElement.classList.toggle('pos-focus',!!focus)}catch(e){}}}
 Object.values(frames).forEach(x=>x.classList.toggle('on',x===f));
 document.querySelectorAll('.sh-rib a,.sh-rq a,.sh-m>a').forEach(a=>{const h=a.dataset.h,hk=h.split('#')[0].split('?')[0];a.classList.toggle('on',hk===key&&(!h.includes('#')||h.split('#')[1]===hash))});
 const tabs=[...$('tb').children],on=document.querySelector('.sh-rib a.on');if(on){const i=[...$('rb').querySelectorAll('.sh-rib')].indexOf(on.closest('.sh-rib'));if(i>=0){tabs.forEach((t,k)=>t.classList.toggle('on',k===i));[...$('rb').querySelectorAll('.sh-rib')].forEach((p,k)=>p.classList.toggle('on',k===i))}}
 app.classList.toggle('focus',!!focus);if(focus){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}else if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}
 history.replaceState(null,'','#'+encodeURIComponent(href))}
