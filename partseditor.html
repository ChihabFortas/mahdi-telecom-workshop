<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Part editor</title>
<link rel="stylesheet" href="common.css"><style>
.pe{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}.lst{max-height:calc(100vh - 230px);overflow-y:auto;padding:8px}
.it{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}.it:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}.it.on{background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:var(--ac)}.it b{font-size:14px;display:block;line-height:1.2}.it small{color:var(--mut)}.ok{color:#16a34a;font-weight:700}
.top2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.pgb{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin:6px 0 12px}.pgb i{display:block;height:100%;background:var(--ac)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f2 .w{grid-column:1/-1}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip3{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--ac) 14%,transparent);font-size:13px}.chip3 button{border:0;background:none;padding:0;min-height:0;cursor:pointer;color:inherit;font-size:15px}
.ib img{width:140px!important;height:140px!important;object-fit:contain}.nav2{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:14px}
@media(max-width:900px){.pe{grid-template-columns:1fr}.lst{display:none}.f2{grid-template-columns:1fr}}</style></head><body><main>
<div class="top2"><div class="bar" style="margin:0;flex:1"><input id="q" placeholder="Search…"><select id="f" style="max-width:220px"><option value="un">Not reviewed</option><option value="ni">No image</option><option value="rv">Reviewed</option><option value="">All</option></select></div><b id="pg"></b></div><div class="pgb"><i id="pb" style="width:0"></i></div>
<div class="pe"><div class="card lst" id="ls"></div><div class="card" id="ed"></div></div></main>
<script type="module">
import {$,esc,db,start,money,num,norm,watchParts,logAudit,user,thumb,PART_TYPES,QUALITY,IMG_HTML,imgPicker,LOC_HTML,wireLoc,locBadge} from "./common.js";
import {collection,onSnapshot,doc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let P=[],A=[],ALL=[],LIST=[],cur=null,shown=null,ip=null,lsync=null,chips=[];
start(()=>{watchParts(p=>{P=p;rebuild()});onSnapshot(collection(db,'products'),s=>{A=s.docs.map(d=>({...d.data(),id:d.id}));rebuild()})});
const filt=()=>{const q=norm($('q').value),f=$('f').value;LIST=ALL.filter(p=>(!q||norm(p.id+' '+p.name+' '+(p.ref||'')+' '+(p.brand||'')+' '+(p.model||'')).includes(q))&&(f===''||(f==='un'?!p.reviewed:f==='rv'?p.reviewed:!p.img)))};
function rebuild(){ALL=[...P.map(p=>({...p,_c:'parts'})),...A.map(p=>({...p,_c:'products'}))].sort((a,b)=>norm(a.name)>norm(b.name)?1:norm(a.name)<norm(b.name)?-1:a.id>b.id?1:-1);filt();
 if(!cur||!LIST.find(p=>p.id===cur.id&&p._c===cur._c)){const i=Math.min(LIST.length-1,Math.max(0,cur?LIST.findIndex(p=>norm(p.name)>=norm(cur.name)):0));cur=LIST[i<0?0:i]||null}else cur=LIST.find(p=>p.id===cur.id&&p._c===cur._c);
 stats();list();if(!shown||!cur||shown!==cur._c+cur.id)edit()}
function stats(){const r=ALL.filter(p=>p.reviewed).length;$('pg').textContent=`${r} / ${ALL.length}`;$('pb').style.width=(ALL.length?r/ALL.length*100:0)+'%'}
function list(){const i=cur?LIST.findIndex(p=>p.id===cur.id&&p._c===cur._c):0,s=Math.max(0,i-8);const ct=$('cnt');if(ct)ct.textContent=(i+1)+' / '+LIST.length;$('ls').innerHTML=LIST.slice(s,s+60).map(p=>`<div class="it ${cur&&p.id===cur.id&&p._c===cur._c?'on':''}" data-k="${p._c}|${esc(p.id)}">${thumb(p)}<div><b>${esc(p.name)}</b><small>${esc(p.id)}${p.reviewed?' <span class="ok">✓</span>':''}</small></div></div>`).join('')||'<p style="color:var(--mut);padding:8px">Nothing to show.</p>';
 $('ls').querySelectorAll('[data-k]').forEach(d=>d.onclick=()=>{const [c,id]=d.dataset.k.split('|');cur=LIST.find(p=>p.id===id&&p._c===c);list();edit()})}
const tidy=s=>String(s||'').replace(/\s+/g,' ').trim().split(' ').map(w=>/\d/.test(w)||w===w.toUpperCase()&&w.length<=4||/^[A-Z]/.test(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
function edit(){const p=cur;if(!p){$('ed').innerHTML='<p style="color:var(--mut)">Nothing to show.</p>';shown=null;return}shown=p._c+p.id;chips=[...(p.compat||[])];const part=p._c==='parts',i=LIST.findIndex(x=>x.id===p.id&&x._c===p._c)+1;
 const models=[...new Set(ALL.filter(x=>x._c==='parts').map(x=>x.model).filter(Boolean))],brands=[...new Set(ALL.map(x=>x.brand).filter(Boolean))],cats=[...new Set(ALL.filter(x=>x._c==='products').map(x=>x.model).filter(Boolean))];
 $('ed').innerHTML=`<div class="top2"><div><b style="font-size:18px">${esc(p.id)}</b> ${p.reviewed?'<span class="ok">✓</span>':''}<br><small style="color:var(--mut)"><span id="cnt">${i} / ${LIST.length}</span> · ${money(p.normal)} · Qty ${num(p.qty)}</small></div><div><button id="pv">◀</button> <button id="nx">▶</button></div></div>
 <div class="f2"><div class="w"><label>Name</label><input id="en" value="${esc(p.name)}" spellcheck="true" autocapitalize="words"><button type="button" id="td" style="margin-top:6px">Tidy spelling</button></div>
 <div><label>Reference</label><input id="er" value="${esc(p.ref||'')}" placeholder="Part number"></div><div><label>Brand</label><input id="eb" list="bl" value="${esc(p.brand||'')}"></div>
 ${part?`<div><label>Part type</label><select id="et">${PART_TYPES.map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Quality</label><select id="eq">${QUALITY.map(t=>`<option ${t===p.quality?'selected':''}>${t}</option>`).join('')}</select></div><div class="w"><label>Phone model</label><input id="em" list="ml" value="${esc(p.model||'')}"></div>`:`<div class="w"><label>Category</label><input id="em" list="cl" value="${esc(p.model||'')}"></div>`}
 <div class="w"><label>Compatible devices</label><div class="chips" id="ch"></div><input id="ec" list="ml" placeholder="Samsung A17"></div><datalist id="bl">${brands.map(b=>`<option value="${esc(b)}">`).join('')}</datalist><datalist id="ml">${models.map(b=>`<option value="${esc(b)}">`).join('')}</datalist><datalist id="cl">${cats.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
 <div id="lps" class="w"></div><div class="w" id="ipk"></div><div class="w"><label>Notes</label><textarea id="eo" rows="2" spellcheck="true">${esc(p.notes||'')}</textarea></div></div>
 <div class="nav2"><button id="sk">Skip ▶</button><button class="p" id="sv">Save</button><button class="p" id="sn" style="background:#14212b;border-color:#14212b;color:#fff">Save & next</button></div>`;
 $('lps').outerHTML=`<div class="w" id="lpw">${LOC_HTML}</div>`;$('ipk').innerHTML=IMG_HTML;ip=imgPicker($('ipk'));ip.set(p.img||'');
 const lw=$('lpw');lw.querySelector('input[name=location]').value=p.location||'';lsync=wireLoc(lw,()=>ALL.map(x=>x.location));lsync();
 const drawCh=()=>{$('ch').innerHTML=chips.map((c,k)=>`<span class="chip3">${esc(c)}<button data-x="${k}">×</button></span>`).join('');$('ch').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{chips.splice(+b.dataset.x,1);drawCh()})};drawCh();
 const addC=()=>{const v=tidy($('ec').value.replace(/,$/,''));if(v&&!chips.includes(v))chips.push(v);$('ec').value='';drawCh()};$('ec').onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addC()}};$('ec').onchange=addC;
 $('td').onclick=()=>{$('en').value=tidy($('en').value)};$('pv').onclick=()=>go(-1);$('nx').onclick=()=>go(1);$('sk').onclick=()=>go(1);$('sv').onclick=()=>save(false);$('sn').onclick=()=>save(true)}
function go(d){const i=LIST.findIndex(x=>x.id===cur.id&&x._c===cur._c),n=LIST[Math.min(LIST.length-1,Math.max(0,i+d))];if(n&&n!==cur){cur=n;list();edit()}}
async function save(next){const p=cur,part=p._c==='parts',name=$('en').value.replace(/\s+/g,' ').trim();if(!name){alert('Name');return}if($('ec').value.trim()){const v=tidy($('ec').value);if(v&&!chips.includes(v))chips.push(v);$('ec').value=''}
 const model=$('em').value.trim(),d={name,ref:$('er').value.trim(),brand:$('eb').value.trim(),model,mk:norm(model),location:$('lpw').querySelector('input[name=location]').value.trim(),compat:chips,notes:$('eo').value.trim(),img:ip.val(),reviewed:true,reviewedAt:Date.now(),reviewedBy:user.email};
 if(part){d.type=$('et').value;d.quality=$('eq').value}
 const i=LIST.findIndex(x=>x.id===p.id&&x._c===p._c),nid=LIST[i+1];$('sn').disabled=true;$('sv').disabled=true;
 try{await setDoc(doc(db,p._c,p.id),d,{merge:true});logAudit('part.edit',p.id);const old=$('f').value;if(next){cur=old==='un'?(LIST[i+1]||null):(LIST[i+1]||p);}else{cur=p}Object.assign(p,d);shown=null;rebuild()}catch(e){alert(e.message);$('sn').disabled=false;$('sv').disabled=false}}
$('q').oninput=()=>{filt();cur=LIST[0]||null;shown=null;stats();list();edit()};$('f').onchange=()=>{filt();cur=LIST[0]||null;shown=null;stats();list();edit()};
</script></body></html>
