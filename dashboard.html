<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Dashboard</title>
<link rel="stylesheet" href="common.css"><style>

@media(max-width:800px){.rh{display:none}.rw{grid-template-columns:1fr auto auto}.rw>:nth-child(2),.rw>:nth-child(4),.rw>:nth-child(5),.rw>:nth-child(7){display:none}.g3{grid-template-columns:1fr}}

</style></head><body><main>
<div class="dh"><div><h2 id="gh"></h2><small id="gd"></small></div><div class="qa"><button class="p" id="qn">+ New ticket</button><button id="qq">New quote</button><button id="qr">↩ Return after repair</button><button id="qp">Request a part</button></div></div>

<script type="module">

 onSnapshot(query(col('tickets'),where('status','!=','returned')),s=>{const c={};s.docs.forEach(d=>c[d.id]=d.data().status);if(prev)Object.keys(c).forEach(k=>{if(prev[k]!==c[k])moved[k]=Date.now()});prev=c;T=s.docs.map(d=>d.data());draw();setTimeout(draw,6500)});
 sub(query(col('tickets'),where('receivedDate','>=',day(-30))),x=>T2=x);sub(col('technicians'),x=>TC=x.filter(t=>t.active!==false));sub(col('partNeeds'),x=>NE=x);

 $('gh').textContent='Good day'+', '+(((profile&&profile.name)||user.email).split(' ')[0]);$('gd').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});

 if(canManage()){const cash=RG.reduce((a,r)=>a+num(r.initial)+CE.filter(e=>e.registerId===r.id).reduce((s,e)=>s+(e.kind==='in'?num(e.amount):-num(e.amount)),0),0),rec=DA.filter(d=>d.customerId).reduce((a,d)=>a+num(d.total)-num(d.paid),0)-PA.reduce((a,p)=>a+num(p.amount),0)-RA.filter(r=>r.kind==='sale'&&r.customerId).reduce((a,r)=>a+num(r.total)-num(r.refund&&r.refund.amount),0);
  cards.push(`<div class="k2" style="--c:#16a34a;cursor:default"><span>Cash in registers</span><b>${fm(cash)}</b></div>`,`<div class="k2" style="--c:#64748b;cursor:default"><span>Receivables</span><b>${fm(rec)}</b></div>`)}
 $('kg').innerHTML=cards.join('');$('kg').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kf=kf===b.dataset.k?'':b.dataset.k;draw()});
 // donut
 const cnt=ORD.map(s=>[s,T.filter(t=>t.status===s).length]).filter(x=>x[1]),tot=cnt.reduce((a,x)=>a+x[1],0);let acc=0;const seg=cnt.map(([s,c])=>{const a=acc/tot*100;acc+=c;return `${STATUS[s][1]} ${a}% ${acc/tot*100}%`}).join(',');

 $('bt').innerHTML=rows.map(r=>`<div class="hb"><span>${esc(r.n)}</span><div class="tr"><i style="width:${r.a/mx*100}%;background:#64748b"></i><i style="width:${r.b/mx*100}%;background:#2563eb"></i><i style="width:${r.c/mx*100}%;background:#16a34a"></i></div><b>${r.a+r.b+r.c}</b></div>`).join('')+(rows.length?`<div class="lg" style="margin-top:10px"><span><i style="background:#64748b"></i><span>New</span></span><span><i style="background:#2563eb"></i><span>In progress</span></span><span><i style="background:#16a34a"></i><span>Ready</span></span></div>`:'<p style="color:var(--mut)">Nothing to show.</p>');
 // received per day
 const ds=[...Array(14)].map((_,i)=>day(i-13)),cn=ds.map(d=>T2.filter(t=>t.receivedDate===d).length),m=Math.max(1,...cn);$('vb').innerHTML=cn.map((v,i)=>`<div title="${ds[i]}">${v||''}<i style="height:${v/m*100}%"></i><span>${ds[i].slice(8)}</span></div>`).join('');
 // filters + list
 const sel=$('tf');if(sel.dataset.sig!==TC.map(t=>t.id).join()){sel.dataset.sig=TC.map(t=>t.id).join();sel.innerHTML='<option value="">All technicians</option><option value="none">Unassigned</option>'+TC.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');sel.value=tf}
 $('fc').innerHTML=[['','All',T.length],...ORD.map(s=>[s,STATUS[s][0],T.filter(t=>t.status===s).length])].map(([k,l,c])=>`<button data-s="${k}" class="${sf===k?'on':''}">${esc(l)} · ${c}</button>`).join('')+(kf?'<button data-k0="1">✕</button>':'');
 $('fc').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sf=b.dataset.s;draw()});const c0=$('fc').querySelector('[data-k0]');if(c0)c0.onclick=()=>{kf='';draw()};
 const q=norm($('q').value),L=T.filter(t=>(!sf||t.status===sf)&&(!kf||KF[kf](t))&&(!tf||(tf==='none'?!t.techId:t.techId===tf))&&(!q||norm([t.code,t.firstName,t.lastName,t.phone,t.model,t.techName].join(' ')).includes(q))).sort((a,b)=>(a.estDelivery||'9')>(b.estDelivery||'9')?1:-1);
 const mv=t=>Date.now()-(moved[t.code]||0)<6000;
 if(view==='list')$('ls').innerHTML=`<div class="rh"><span>Device</span><span>Customer</span><span>Status</span><span>Technician</span><span>Level</span><span>Delivery</span><span>Price</span></div>`+(L.map(t=>`<div class="rw ${mv(t)?'moved':''}" style="--c:${STATUS[t.status][1]}" data-c="${t.code}"><div><b>${esc(t.model)}</b> <small>${esc(t.color)}</small>${t.isReturn?' <span class="chip2" style="--c:#b45309"><i></i>↩</span>':''}<br><small>${t.code}</small></div><div>${esc(t.firstName)} ${esc(t.lastName)}<br><small>${esc(t.phone)}</small></div><div>${chip(t.status)}</div><div>${t.techName?`<span class="av2">${esc(t.techName[0])}</span>${esc(t.techName)}`:'<small>–</small>'}</div><div>${t.level==null?'':`<span class="lvp l${num(t.level)}">L${num(t.level)}</span>`}</div><div class="${late(t)?'late':''}">${t.estDelivery||'–'}${late(t)?'<br><small class="late">Late</small>':''}</div><div>${t.price!=null?fm(t.price):''}</div></div>`).join('')||'<p style="color:var(--mut);padding:10px">Nothing to show.</p>');

 ${['ready','no_repair'].includes(t.status)?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center"><button class="p" id="nw">WhatsApp</button><button id="ns">SMS</button><button id="nc">Copy message</button><small style="color:var(--mut)">${t.notifiedAt?'✓ '+new Date(t.notifiedAt).toLocaleString()+' · '+esc(t.notifiedVia||''):''}</small></div>`:''}
