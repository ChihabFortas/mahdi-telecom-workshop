<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Admin</title>
<link rel="stylesheet" href="common.css"></head><body>
<header><h1>Mahdi Repair – Admin</h1><button onclick="location.href='manager.html'">Manager overview</button><button onclick="location.href='board.html'">Live board</button><button onclick="location.href='reception.html'">Reception desk</button><button onclick="location.href='technician.html'">Technician board</button><button onclick="location.href='pos.html'">POS</button><button onclick="location.href='inventory.html'">Inventory</button><button onclick="location.href='treasury.html'">Treasury</button><button onclick="location.href='partsqueue.html'">Parts queue</button><button onclick="location.href='techreport.html'">Bonus report</button><button onclick="location.href='statistics.html'">Statistics</button><button onclick="location.href='suppliers.html'">Suppliers</button><button onclick="location.href='invoices.html'">Invoices</button><button onclick="location.href='seed.html'">Demo data</button><button id="lo">Sign out</button></header>
<main><div class="tabs" id="tabs"></div>
<section id="t-us"><div class="bar"><button class="p" id="na" style="flex:0 0 auto">+ Add staff</button></div><div class="card"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody id="ul"></tbody></table></div></section>
<section id="t-au" hidden><div class="bar"><input id="aq" placeholder="Filter the log"></div><div class="card"><table><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Detail</th></tr></thead><tbody id="al"></tbody></table></div></section>
<section id="t-ac" hidden><div class="card"><table id="mx"></table></div><p style="color:var(--mut)">Sessions end automatically after a period of inactivity.</p></section>
<section id="t-ms" hidden><div class="card"><h3 style="margin-top:0">Customer messages</h3><div class="g" style="padding:0"><div><label>Country code (digits, e.g. 213)</label><input id="mcc" inputmode="numeric"></div><div><label>Default customer language</label><select id="mlg"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div></div><p style="color:var(--mut)">{name} {device} {shop} {link} {price} {code}</p><div id="mtp"></div></div><div class="bar"><button class="p" id="mss" style="flex:0 0 auto">Save</button></div></section>
<section id="t-bn" hidden><div class="card"><h3 style="margin-top:0">Repair bonuses</h3><p style="color:var(--mut)">Amount paid per repaired device, for each repair level.</p><div id="bnr" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px"></div></div><div class="card"><b>Per-technician override</b><div id="bno" style="margin-top:8px"></div></div><div class="bar"><button class="p" id="bns" style="flex:0 0 auto">Save</button></div></section></main>
<dialog id="nd"><form class="g" id="nf"><h2>Add staff</h2><div><label>Name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div>
<div><label>Temporary password</label><input name="pw" type="text" minlength="6" required></div><div><label>Role</label><select name="role"><option value="reception">Reception</option><option value="technician">Technician</option><option value="inventory">Inventory</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div>
<div class="fa"><button type="button" id="nc">Cancel</button><button class="p">Create</button></div></form></dialog>
<script type="module">
import {$,esc,db,start,logAudit,user,num,MSG_DEF} from "./common.js";
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const T=[['us','Users'],['bn','Repair bonuses'],['ms','Customer messages'],['au','Audit log'],['ac','Access rights']],ROLES=['reception','technician','inventory','manager','admin'];let TECH=[],BN={rates:[0,0,0,0],overrides:{}};let U=[],L=[];
$('tabs').innerHTML=T.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
const tab=k=>{T.forEach(([x])=>$('t-'+x).hidden=x!==k);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===k))};document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));tab('us');
const M=[['Feature','Reception','Technician','Manager','Admin'],['Reception desk: create / edit tickets','✓','–','✓','✓'],['Delete tickets','–','–','✓','✓'],['Technician board, use / request parts','request','✓','✓','✓'],['New quote and POS sales, customers, payments','✓','–','✓','✓'],['See inventory','✓','✓','✓','✓'],['Manage parts, accessories, receiving notes, import','–','–','✓','✓'],['Buy price, special price, profit','–','–','✓','✓'],['Manager overview and audit feed','–','–','✓','✓'],['Repair level and technician assignment','✓','–','✓','✓'],['Own devices board, request parts, new quote, mark repaired','–','✓','✓','✓'],['Approve price changes','✓','–','✓','✓'],['Issue parts to technicians','–','–','✓','✓'],['Inventory staff: parts queue','–','–','–','–'],['Bonus report','–','–','✓','✓'],['Return after repair, return without repair','✓','request','✓','✓'],['Part requests and purchase orders from needs','request','request','✓','✓'],['Users, roles, audit log, bonus rates, demo data','–','–','–','✓']];
$('mx').innerHTML=M.map((r,i)=>`<tr>${r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('');
start(()=>{onSnapshot(collection(db,'technicians'),s=>{TECH=s.docs.map(d=>({...d.data(),id:d.id}));syncTech()});onSnapshot(doc(db,'settings','bonus'),s=>{BN={rates:[0,0,0,0],overrides:{},...(s.data()||{})};drawBn()});onSnapshot(collection(db,'users'),s=>{U=s.docs.map(d=>({...d.data(),id:d.id}));users();syncTech();drawBn()});onSnapshot(query(collection(db,'audit'),orderBy('at','desc'),limit(200)),s=>{L=s.docs.map(d=>d.data());audit()})});
function users(){$('ul').innerHTML=U.map(u=>{const me=u.id===user.uid;return `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select data-r="${u.id}" ${me?'disabled':''}>${ROLES.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r[0].toUpperCase()+r.slice(1)}</option>`).join('')}</select></td><td><input type="checkbox" data-a="${u.id}" ${u.active?'checked':''} ${me?'disabled':''} style="width:auto"></td><td><button data-p="${esc(u.email)}">Reset password</button></td></tr>`}).join('');
 $('ul').querySelectorAll('[data-r]').forEach(e=>e.onchange=async()=>{await updateDoc(doc(db,'users',e.dataset.r),{role:e.value});logAudit('user.role',U.find(u=>u.id===e.dataset.r).email+' → '+e.value)});
 $('ul').querySelectorAll('[data-a]').forEach(e=>e.onchange=async()=>{await updateDoc(doc(db,'users',e.dataset.a),{active:e.checked});logAudit(e.checked?'user.enable':'user.disable',U.find(u=>u.id===e.dataset.a).email)});
 $('ul').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{try{await sendPasswordResetEmail(getAuth(),b.dataset.p);logAudit('user.reset',b.dataset.p);alert('If this email has an account, a reset link was sent.')}catch(x){alert(x.message)}})}
function audit(){const q=$('aq').value.toLowerCase();$('al').innerHTML=L.filter(l=>!q||JSON.stringify([l.action,l.detail,l.by,l.role]).toLowerCase().includes(q)).map(l=>`<tr><td>${l.at?.toDate().toLocaleString()||''}</td><td>${esc(l.by)}</td><td>${esc(l.role)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="5">Nothing to show.</td></tr>'}
$('aq').oninput=audit;$('na').onclick=()=>{$('nf').reset();$('nd').showModal()};$('nc').onclick=()=>$('nd').close();
$('nf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));
 try{const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec),c=await createUserWithEmailAndPassword(sa,v.email,v.pw);await signOut(sa);
  await setDoc(doc(db,'users',c.user.uid),{email:v.email,name:v.name,role:v.role,active:true,createdAt:serverTimestamp()});logAudit('user.create',v.email+' · '+v.role);$('nd').close()}catch(x){alert(x.message)}};
function syncTech(){if(!U.length)return;U.forEach(u=>{const t=TECH.find(x=>x.id===u.id),want=u.role==='technician';if(want&&(!t||t.name!==u.name||t.active!==!!u.active))setDoc(doc(db,'technicians',u.id),{name:u.name,active:!!u.active,email:u.email});else if(!want&&t)deleteDoc(doc(db,'technicians',u.id))})}
const LV=['Level 0 – Basic','Level 1 – Normal','Level 2 – Difficult','Level 3 – Most difficult'];
function drawBn(){$('bnr').innerHTML=LV.map((l,i)=>`<div><label>${l}</label><input type="number" min="0" step="0.01" data-r="${i}" value="${num(BN.rates[i])}"></div>`).join('');const ts=U.filter(u=>u.role==='technician');
 $('bno').innerHTML=`<table style="min-width:0"><thead><tr><th>Name</th>${[0,1,2,3].map(i=>`<th>L${i}</th>`).join('')}</tr></thead><tbody>${ts.map(u=>`<tr><td>${esc(u.name)}</td>${[0,1,2,3].map(i=>`<td data-label="L${i}"><input type="number" min="0" step="0.01" style="width:90px" data-o="${u.id}|${i}" value="${(BN.overrides[u.id]||[])[i]??''}" placeholder="–"></td>`).join('')}</tr>`).join('')||'<tr><td colspan="5">Nothing to show.</td></tr>'}</tbody></table>`}
$('bns').onclick=async()=>{const rates=[...$('bnr').querySelectorAll('[data-r]')].map(x=>num(x.value)),ov={};$('bno').querySelectorAll('[data-o]').forEach(x=>{const [id,i]=x.dataset.o.split('|');(ov[id]=ov[id]||[null,null,null,null])[+i]=x.value===''?null:num(x.value)});Object.keys(ov).forEach(k=>{if(ov[k].every(v=>v==null))delete ov[k]});
 try{await setDoc(doc(db,'settings','bonus'),{rates,overrides:ov,updatedBy:user.email,at:serverTimestamp()});logAudit('bonus.save',rates.join(' / '));alert('Saved')}catch(x){alert(x.message)}};
const KINDS=[['ready','Ready for pickup'],['nr','Return without repair']],LGS=[['en','English'],['fr','Français'],['ar','العربية']];let MC={};
onSnapshot(doc(db,'settings','shop'),s=>{MC=s.data()||{};$('mcc').value=MC.countryCode||'';$('mlg').value=MC.defaultLang||'en';$('mtp').innerHTML=KINDS.map(([k,l])=>`<h4 style="margin:14px 0 4px">${l}</h4>`+LGS.map(([g,n])=>`<label>${n}</label><textarea rows="2" data-k="${k}" data-l="${g}" style="margin-bottom:8px">${esc((((MC.tpl||{})[k]||{})[g])||MSG_DEF[k][g])}</textarea>`).join('')).join('')},()=>{});
$('mss').onclick=async()=>{const tpl={ready:{},nr:{}};document.querySelectorAll('#mtp textarea').forEach(x=>tpl[x.dataset.k][x.dataset.l]=x.value);try{await setDoc(doc(db,'settings','shop'),{countryCode:$('mcc').value.replace(/\D/g,''),defaultLang:$('mlg').value,tpl,updatedBy:user.email,at:serverTimestamp()},{merge:true});logAudit('messages.save','');alert('Saved')}catch(x){alert(x.message)}};
</script></body></html>
