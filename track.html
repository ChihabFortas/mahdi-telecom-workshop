<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your repair</title>
<style>
:root{--ink:#14212b;--mut:#5d6b77;--bg:#eef1f4;--card:#fff;--ac:#0f7b7b;--line:#d9e0e6}
*{box-sizing:border-box}select{font:inherit;border:1px solid var(--line);border-radius:8px}body{margin:0;font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 18px}
form{display:flex;gap:8px}input{flex:1;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}
button{padding:13px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.card h2{margin:0;font-size:20px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span:first-child{color:var(--mut)}
.steps{display:flex;margin:16px 0 4px}.st{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.st i{display:block;height:8px;background:var(--line);margin:0 2px 6px;border-radius:4px}.st.on i{background:var(--ac)}.st.on{color:var(--ink);font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;background:#dff3f1;color:#0a5a5a;font-weight:600;font-size:14px}
.err{color:#b3261e;margin-top:14px}.stars{display:flex;gap:4px}.stars span{font-size:36px;line-height:1;color:#cbd5e1;cursor:pointer;user-select:none}.stars span.on{color:#f59e0b}.rate textarea{width:100%;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.rate b{display:block;margin-bottom:6px}
</style></head><body><main>
<div style="text-align:end"><select id="lg" style="width:auto;padding:6px"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div>
<h1 id="shop">Track your repair</h1><p class="s">Enter your tracking code or the phone number you gave us.</p>
<form id="f"><input id="q" placeholder="RD-XXXXXX or phone number" autocomplete="off" required><button>Track</button></form>
<div id="out"></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig,SHOP} from "./firebase-config.js";
import {S,setLang} from "./ui.js";
const db=getFirestore(initializeApp(firebaseConfig));
document.getElementById('shop').textContent=SHOP.name+" – repair tracking";
const LABEL={received:"Reception",diagnose:"Diagnose",awaiting_approval:"Waiting for your approval",waiting_parts:"Waiting for parts",repair:"Repair",ready:"Ready for pickup",no_repair:"Returned without repair",returned:"Returned"};
const STEP=s=>({received:0,diagnose:1,awaiting_approval:1,waiting_parts:2,repair:2,ready:3,no_repair:3,returned:3}[s]);
const out=document.getElementById('out'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function find(v){
  v=v.trim().toUpperCase();
  let s=await getDoc(doc(db,'tracking',v)); if(s.exists())return [s.data()];
  const p=await getDoc(doc(db,'trackingPhone',v.replace(/\D/g,'')||'x')); if(!p.exists())return [];
  const all=await Promise.all((p.data().codes||[]).map(c=>getDoc(doc(db,'tracking',c))));
  return all.filter(x=>x.exists()).map(x=>x.data());
}
function card(t){const n=STEP(t.status),names=["Reception","Diagnose","Repair","Return"];
 return `<div class="card"><h2>${esc(t.model)}</h2><span class="badge">${LABEL[t.status]||esc(t.status)}</span>
 <div class="steps">${names.map((x,i)=>`<div class="st ${i<=n?'on':''}"><i></i>${x}</div>`).join('')}</div>
 <div class="row"><span>Code</span><b>${esc(t.code)}</b></div><div class="row"><span>Customer</span><span>${esc(t.firstName)}</span></div>
 <div class="row"><span>Problem</span><span>${esc(t.problem)}</span></div><div class="row"><span>Received</span><span>${esc(t.receivedDate)}</span></div>
 <div class="row"><span>Estimated delivery</span><span>${esc(t.estDelivery||'To be confirmed')}</span></div>
 <div class="row"><span>Quotation</span><b>${t.price!=null&&t.price!==''?esc(t.priceText||t.price):'Pending'}</b></div>${['ready','returned','no_repair'].includes(t.status)?`<div class="rate" data-code="${esc(t.code)}" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><b>How was our service?</b><div class="stars">${[1,2,3,4,5].map(i=>`<span data-s="${i}">★</span>`).join('')}</div><textarea rows="3" maxlength="500" placeholder="Your comment (optional)"></textarea><button type="button">Send</button> <span class="err" style="margin:0"></span></div>`:''}</div>`}
async function go(v){out.innerHTML='';try{const r=await find(v);out.innerHTML=r.length?r.map(card).join(''):'<p class="err">No repair found. Check the code or phone number.</p>'}catch(e){out.innerHTML='<p class="err">Could not load. Try again in a moment.</p>'}}
function wire(){document.querySelectorAll('.rate').forEach(r=>{const code=r.dataset.code,thanks=()=>{r.innerHTML='<p style="margin:0"><b>Thank you for your feedback!</b> ★</p>'};if(localStorage.getItem('fb_'+code)){thanks();return}let v=0;const st=r.querySelectorAll('[data-s]');st.forEach(s=>s.onclick=()=>{v=+s.dataset.s;st.forEach(x=>x.classList.toggle('on',+x.dataset.s<=v))});
 r.querySelector('button').onclick=async()=>{if(!v){r.querySelector('.err').textContent='Please choose a rating';return}try{await setDoc(doc(db,'feedback',code),{code,rating:v,comment:r.querySelector('textarea').value.slice(0,500),createdAt:serverTimestamp()})}catch(e){}localStorage.setItem('fb_'+code,'1');thanks()}})}
f.onsubmit=e=>{e.preventDefault();go(q.value).then(wire)};
lg.value=S.lang;lg.onchange=()=>setLang(lg.value);
const c=new URLSearchParams(location.search).get('code'); if(c){q.value=c;go(c).then(wire)}
</script></body></html>
