<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Technician</title>
<link rel="stylesheet" href="common.css"><style>.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kp b{display:block;font-size:28px}.kp span{font-size:13px;color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;align-items:start}.col h3{margin:0 0 8px;display:flex;justify-content:space-between}
.tk{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px;margin-bottom:12px;font-size:16px}.tk b.m{font-size:18px}.tk small{color:var(--mut)}.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:#e6ecf0;font-size:12px;margin:3px 4px 0 0;color:#14212b}.chip.r{background:#fdf0d5}.chip.i{background:#dbeafe}.chip.u{background:#dff3f1}
.lv{display:inline-block;padding:1px 8px;border-radius:8px;font-weight:700;font-size:13px;color:#fff;background:#0f7b7b}.lv.l2{background:#c27a00}.lv.l3{background:#b3261e}.lv.l0{background:#6b7c8a}.late{color:var(--bad);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.acts button,.acts select{min-height:46px;font-size:15px}.pq{background:#f4e9fb;border-radius:10px;padding:8px 10px;margin-top:8px;color:#4a1a63}td.n,th.n{text-align:end}</style></head><body>
<header><h1>Mahdi Repair – Technician</h1><button onclick="location.href='inventory.html'">Inventory</button><button onclick="location.href='reception.html'">Reception desk</button><button onclick="location.href='partsqueue.html'">Parts queue</button><button onclick="location.href='techreport.html'">Bonus report</button><button onclick="location.href='manager.html'">Manager overview</button><button id="lo">Sign out</button></header>
<main><div class="tabs" id="tabs"></div><div class="bar" id="tfb" hidden><select id="tf"></select></div>
<section id="t-my"><div class="kp" id="kp"></div><div class="cols" id="cols"></div></section>
<section id="t-hs" hidden><div class="bar"><input type="month" id="hm"><select id="hst"><option value="">All</option><option value="open">Open</option><option value="ready">Ready for pickup</option><option value="returned">Returned</option></select></div><div class="card"><table><thead><tr><th>Code</th><th>Device</th><th>Level</th><th>Received</th><th>Status</th><th>Repaired</th></tr></thead><tbody id="hl"></tbody></table></div></section>
<section id="t-st" hidden><div class="bar"><input type="month" id="sm"></div><div class="kp" id="sk"></div><div class="card"><table><thead><tr><th>Code</th><th>Device</th><th>Level</th><th>Repaired</th><th class="n">Bonus</th></tr></thead><tbody id="sl"></tbody></table></div></section></main>
<dialog id="rd"><form class="g" id="rf"><h2>Request parts</h2><p class="w" id="rn" style="margin:0;font-weight:700"></p><div class="w" id="rl"></div><div class="fa"><button type="button" class="cx">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="nd"><form class="g" id="nf"><h2>Return without repair</h2><p class="w" id="nn" style="margin:0;font-weight:700"></p><div><label>Reason</label><select name="kind" id="nk"><option value="unrepairable">Unrepairable</option><option value="customer">Customer decision</option></select></div><div><label>Detail</label><select name="reason" id="nr"></select></div><div class="w"><label>Note</label><textarea name="note" rows="3"></textarea></div><div class="fa"><button type="button" class="cx">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="qd"><form class="g" id="qf"><h2>New quote</h2><p class="w" id="qn" style="margin:0;font-weight:700"></p><div><label>Current price</label><input id="qc" readonly></div><div><label>New total price</label><input name="price" type="number" step="0.01" min="0" required></div><div class="w"><label>Note</label><textarea name="note" rows="3" required></textarea></div><div class="fa"><button type="button" class="cx">Cancel</button><button class="p">Send to reception</button></div></form></dialog>
<script type="module">
import {$,gen,esc,db,start,money,num,norm,watchParts,moveStock,logAudit,role,user,profile,linesEditor,priceOf,devLine} from "./common.js";
import {collection,onSnapshot,doc,setDoc,updateDoc,query,where,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const LV=['Basic','Normal','Difficult','Most difficult'],ST=[["received","Reception","#6b7c8a"],["diagnose","Diagnose","#c27a00"],["awaiting_approval","Waiting approval","#a44fb3"],["waiting_parts","Waiting parts","#8a5a3c"],["repair","Repair","#1f6fd1"],["ready","Ready for pickup","#1e8e4e"],["no_repair","Return without repair","#7a7a7a"],["returned","Returned","#14212b"]],SM=Object.fromEntries(ST.map(s=>[s[0],s]));
const COLS=[['To diagnose',['received','diagnose']],['Waiting',['awaiting_approval','waiting_parts']],['In repair',['repair']],['Ready for pickup',['ready','no_repair']]];
let S1={},S2={},MAP={},BN={rates:[0,0,0,0],overrides:{}},P=[],A=[],TC=[],cur=null,tfv='';const fm=money,today=()=>new Date().toISOString().slice(0,10),ym=today().slice(0,7);
const T=[['my','My devices'],['hs','History'],['st','My stats']];$('tabs').innerHTML=T.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
const tab=k=>{T.forEach(([x])=>$('t-'+x).hidden=x!==k);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===k))};document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));tab('my');
document.querySelectorAll('.cx').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('hm').value='';$('sm').value=ym;
const items=()=>[...P.map(p=>({...p,_c:'parts'})),...A.map(p=>({...p,_c:'products'}))],colOf=k=>P.find(x=>x.id===k)?'parts':'products',buy=k=>num((P.find(x=>x.id===k)||A.find(x=>x.id===k)||{}).buy);
const sub=(q,set)=>onSnapshot(q,s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());set(m);MAP={...S1,...S2};draw()},e=>console.warn(e.message));
start(()=>{const tech=role==='technician';
 if(tech){sub(query(collection(db,'tickets'),where('techId','==',user.uid)),m=>S1=m);sub(query(collection(db,'tickets'),where('repairedBy','==',user.uid)),m=>S2=m)}
 else{$('tfb').hidden=false;sub(collection(db,'tickets'),m=>S1=m);onSnapshot(collection(db,'technicians'),s=>{TC=s.docs.map(d=>({...d.data(),id:d.id}));$('tf').innerHTML='<option value="">All</option><option value="none">Unassigned</option>'+TC.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');$('tf').value=tfv})}
 onSnapshot(doc(db,'settings','bonus'),s=>{BN={rates:[0,0,0,0],overrides:{},...(s.data()||{})};draw()},()=>{});watchParts(p=>{P=p});onSnapshot(collection(db,'products'),s=>{A=s.docs.map(d=>({...d.data(),id:d.id}))})});
$('tf').onchange=()=>{tfv=$('tf').value;draw()};
const rate=(uid,l)=>{const o=(BN.overrides||{})[uid];return o&&o[l]!=null?num(o[l]):num((BN.rates||[])[l])};
const mine=t=>role==='technician'||!tfv||(tfv==='none'?!t.techId:t.techId===tfv),all=()=>Object.values(MAP).filter(mine);
const late=t=>t.estDelivery&&t.estDelivery<today()&&!['ready','no_repair'].includes(t.status);
const lvH=n=>`<span class="lv l${num(n)}">L${num(n)}</span> <span>${LV[num(n)]}</span>`;
function draw(){const O=all().filter(t=>t.status!=='returned').sort((a,b)=>(a.estDelivery||'9')>(b.estDelivery||'9')?1:-1);
 $('kp').innerHTML=COLS.map(([n,s])=>`<div><b>${O.filter(t=>s.includes(t.status)).length}</b><span>${n}</span></div>`).join('')+`<div><b class="${O.some(late)?'late':''}">${O.filter(late).length}</b><span>Late</span></div>`;
 $('cols').innerHTML=COLS.map(([n,s])=>{const L=O.filter(t=>s.includes(t.status));return `<div class="col"><h3><span>${n}</span><span class="bd">${L.length}</span></h3>`+(L.map(t=>{const d=Math.max(0,Math.floor((Date.now()-new Date(t.receivedDate))/864e5)),pq=t.pendingQuote,locked=t.status==='awaiting_approval',ready=t.status==='ready';
  return `<div class="tk" style="--c:${SM[t.status][2]}"><b class="m">${esc(t.model)}</b> <small>${esc(t.color)}</small> ${lvH(t.level)}${t.isReturn?' <span class="chip r">↩ Return</span>':''}<br><small>${t.code} · ${esc(t.firstName)} · ${d}d${role!=='technician'?' · '+esc(t.techName||'–'):''}</small><div style="margin:6px 0">${esc(t.problem)}</div>${t.device?`<div><small>${devLine(t)}</small></div>`:''}${t.isReturn?`<div class="pq" style="background:#fdf0d5;color:#8a5a00">↩ ${t.returnKind==='same'?'Same problem':'Another problem'}: ${esc(t.returnNote||'')}</div>`:''}
  <div class="${late(t)?'late':''}"><small>${t.estDelivery||'-'}${late(t)?' (late)':''}</small></div><div>${(t.items||[]).map(i=>`<span class="chip ${i.status==='used'?'u':i.status==='issued'?'i':i.status==='requested'?'r':''}">${esc(i.type||i.name)} · ${i.status}</span>`).join('')}</div>
  ${pq?`<div class="pq"><b>Waiting approval</b>: ${fm(pq.price)}${pq.contacted?' · ✓':''}</div>`:''}
  ${t.status==='no_repair'?`<div class="pq" style="background:#eee;color:#333"><b>Return without repair</b>: ${esc(NRR[(t.noRepair||{}).reason]||'')}<br>${esc((t.noRepair||{}).note||'')}</div>`:ready?`<div class="pq" style="background:#e3f6ea;color:#0f5a2a">✓ Ready for pickup</div>`:`<div class="acts"><select data-s="${t.code}" ${locked?'disabled':''}>${locked?`<option>Waiting approval</option>`:[['received','Reception'],['diagnose','Diagnose'],['waiting_parts','Waiting parts'],['repair','Repair']].map(x=>`<option value="${x[0]}" ${x[0]===t.status?'selected':''}>${x[1]}</option>`).join('')}</select><button data-q="${t.code}">New quote</button><button data-r="${t.code}" ${locked?'disabled':''}>Request parts</button><button data-p="${t.code}">Parts & quote</button><button class="p" style="grid-column:1/-1" data-d="${t.code}" ${locked?'disabled':''}>Mark repaired</button><button class="d" style="grid-column:1/-1" data-n="${t.code}">Return without repair</button></div>`}</div>`}).join('')||'<p style="color:var(--mut)">Nothing to do here.</p>')+'</div>'}).join('');
 document.querySelectorAll('[data-s]').forEach(e=>e.onchange=()=>setStatus(e.dataset.s,e.value));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>location.href='quote.html?code='+b.dataset.p);
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openQ(MAP[b.dataset.q]));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openR(MAP[b.dataset.r]));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>done(MAP[b.dataset.d]));document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>openN(MAP[b.dataset.n]));
 hist();stats()}
async function setStatus(code,s){try{await updateDoc(doc(db,'tickets',code),{status:s,history:arrayUnion({s,t:Date.now()}),updatedAt:serverTimestamp()});await updateDoc(doc(db,'tracking',code),{status:s});logAudit('ticket.status',code+' → '+s)}catch(x){alert(x.message)}}
// request parts
const ed=linesEditor($('rl'),{items,price:p=>priceOf(p,'p'),label:'Price'});
function openR(t){cur=t;$('rn').textContent=t.code+' · '+t.model;ed.refresh();ed.set(null);$('rd').showModal()}
$('rf').onsubmit=async e=>{e.preventDefault();const L=ed.get();if(!L.length||L.some(l=>!l.sku)){alert('Unknown item. Pick it from the list.');return}const t=MAP[cur.code],all2=items();
 const add=L.map(l=>{const p=all2.find(x=>x.id===l.sku)||{};return {sku:l.sku,name:l.name,type:p.type||p.model||'',quality:p.quality||'',col:l.col||p._c,qty:l.qty,price:l.price,status:'requested',requestedBy:user.email,requestedByName:(profile&&profile.name)||user.email,requestedAt:Date.now()}});
 try{await updateDoc(doc(db,'tickets',t.code),{items:[...(t.items||[]),...add],updatedAt:serverTimestamp()});logAudit('parts.request',t.code+' · '+add.length);const short=add.filter(a=>{const p=items().find(x=>x.id===a.sku);return !p||num(p.qty)<a.qty});
  for(const a of short){const p=items().find(x=>x.id===a.sku)||{},stock=num(p.qty);await setDoc(doc(db,'partNeeds',t.code+'_'+a.sku),{sku:a.sku,name:a.name,col:a.col,qty:Math.max(1,a.qty-stock),stock,ticketCode:t.code,model:t.model,source:'workshop',status:'open',requestedBy:user.email,requestedByName:(profile&&profile.name)||user.email,createdAt:serverTimestamp()},{merge:true});logAudit('part.need',t.code+' · '+a.sku)}
  if(short.length)alert('Out of stock – flagged to inventory.');$('rd').close()}catch(x){alert(x.message)}};
// new quote
function openQ(t){cur=t;$('qn').textContent=t.code+' · '+t.model;const est=(t.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.price),0)+(t.services||[]).reduce((a,s)=>a+num(s.price),0);$('qc').value=t.price!=null?t.price:'';$('qf').reset();$('qc').value=t.price!=null?t.price:'';$('qf').elements.price.value=est||t.price||'';$('qd').showModal()}
$('qf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),t=MAP[cur.code];
 try{await updateDoc(doc(db,'tickets',t.code),{status:'awaiting_approval',pendingQuote:{price:num(v.price),oldPrice:t.price!=null?t.price:null,note:v.note,by:user.email,byName:(profile&&profile.name)||user.email,at:Date.now(),contacted:false},history:arrayUnion({s:'awaiting_approval',t:Date.now()}),updatedAt:serverTimestamp()});await updateDoc(doc(db,'tracking',t.code),{status:'awaiting_approval'});logAudit('quote.request',t.code+' · '+fm(num(v.price)));$('qd').close()}catch(x){alert(x.message)}};
// mark repaired: deduct issued parts, credit the technician
async function done(t){if(t.status==='awaiting_approval')return;const issued=(t.items||[]).filter(i=>i.status==='issued'),pend=(t.items||[]).filter(i=>i.status==='requested');
 if(pend.length&&!confirm('Some requested parts were not issued yet. Mark repaired anyway?'))return;if(!confirm('Mark this device as repaired and waiting for return to the customer?'))return;
 const ok=[];try{for(const i of issued){await moveStock(i.sku,-num(i.qty),'use',t.code,t.model,i.col||colOf(i.sku));ok.push(i)}}catch(e){for(const i of ok)await moveStock(i.sku,num(i.qty),'return',t.code,'Rolled back',i.col||colOf(i.sku)).catch(()=>{});alert(e.message);return}
 const itemsN=(t.items||[]).map(i=>i.status==='issued'?{...i,status:'used',cost:buy(i.sku)}:i),uid=t.techId||user.uid,nm=t.techId?t.techName:((profile&&profile.name)||user.email);
 try{await updateDoc(doc(db,'tickets',t.code),{status:'ready',items:itemsN,repairedBy:uid,repairedByName:nm,repairedAt:Date.now(),repairLevel:num(t.level),history:arrayUnion({s:'ready',t:Date.now()}),updatedAt:serverTimestamp()});await updateDoc(doc(db,'tracking',t.code),{status:'ready'});logAudit('ticket.repaired',t.code+' · L'+num(t.level))}catch(x){alert(x.message)}}
// history + stats
function hist(){const m=$('hm').value,f=$('hst').value;const L=all().filter(t=>(role!=='technician'||t.techId===user.uid)&&(!m||(t.receivedDate||'').startsWith(m))&&(!f||(f==='open'?!['ready','returned'].includes(t.status):t.status===f))).sort((a,b)=>(b.receivedDate||'')>(a.receivedDate||'')?1:-1);
 $('hl').innerHTML=L.map(t=>`<tr><td><b>${t.code}</b></td><td>${esc(t.model)} ${esc(t.color)}<br><small>${esc(t.problem)}</small></td><td>${lvH(t.level)}</td><td>${t.receivedDate||''}</td><td>${SM[t.status]?SM[t.status][1]:t.status}</td><td>${t.repairedAt?new Date(t.repairedAt).toISOString().slice(0,10):''}</td></tr>`).join('')||'<tr><td colspan="6">Nothing to show.</td></tr>'}
$('hm').onchange=hist;$('hst').onchange=hist;
function stats(){const m=$('sm').value||ym,R=Object.values(MAP).filter(t=>t.repairedAt&&new Date(t.repairedAt).toISOString().slice(0,7)===m&&(role==='technician'?t.repairedBy===user.uid:(!tfv||(tfv==='none'?false:t.repairedBy===tfv)))).sort((a,b)=>b.repairedAt-a.repairedAt);
 const c=[0,1,2,3].map(l=>R.filter(t=>num(t.repairLevel)===l).length),bonus=R.reduce((a,t)=>a+rate(t.repairedBy,num(t.repairLevel)),0);
 $('sk').innerHTML=[...c.map((n,l)=>`<div><b>${n}</b><span>L${l} · ${LV[l]}</span></div>`),`<div><b>${R.length}</b><span>Total</span></div>`,`<div><b>${fm(bonus)}</b><span>Bonus</span></div>`].join('');
 $('sl').innerHTML=R.map(t=>`<tr><td><b>${t.code}</b></td><td>${esc(t.model)} ${esc(t.color)}</td><td>${lvH(t.repairLevel)}</td><td>${new Date(t.repairedAt).toISOString().slice(0,10)}</td><td class="n">${fm(rate(t.repairedBy,num(t.repairLevel)))}</td></tr>`).join('')||'<tr><td colspan="5">Nothing to show.</td></tr>'}
$('sm').onchange=stats;
// return without repair
const NRR={unrepairable:'Unrepairable',high_price:'High price',data_loss:"Customer doesn't want to lose data",part_unavailable:'Part unavailable – customer does not want to wait',diagnosis_only:'Customer wants diagnosis only'};
const fillNR=()=>{const k=$('nk').value;$('nr').innerHTML=k==='unrepairable'?'<option value="unrepairable">Unrepairable</option>':['high_price','data_loss','part_unavailable','diagnosis_only'].map(r=>`<option value="${r}">${NRR[r]}</option>`).join('')};
$('nk').onchange=fillNR;function openN(t){cur=t;$('nf').reset();fillNR();$('nn').textContent=t.code+' · '+t.model;$('nd').showModal()}
$('nf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),t=MAP[cur.code];if(!confirm('Return without repair'+' ?'))return;
 const it=(t.items||[]).map(i=>i.status==='requested'?{...i,status:'cancelled'}:i);
 try{await updateDoc(doc(db,'tickets',t.code),{status:'no_repair',noRepair:{kind:v.kind,reason:v.reason,note:v.note,by:user.email,byName:(profile&&profile.name)||user.email,byId:user.uid,at:Date.now()},pendingQuote:null,items:it,history:arrayUnion({s:'no_repair',t:Date.now()}),updatedAt:serverTimestamp()});await updateDoc(doc(db,'tracking',t.code),{status:'no_repair'});logAudit('ticket.norepair',t.code+' · '+v.reason);$('nd').close()}catch(x){alert(x.message)}};
</script></body></html>
