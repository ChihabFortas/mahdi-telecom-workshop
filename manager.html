<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Manager</title>
<link rel="stylesheet" href="common.css"><style>.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kp b{display:block;font-size:24px}.kp span{font-size:13px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px}.br{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.br i{display:block;height:14px;border-radius:7px;background:var(--c,var(--ac));min-width:3px}
.cv{display:flex;align-items:flex-end;gap:5px;height:120px}.cv div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}.cv small{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px}.ls div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.low{color:var(--bad);font-weight:600}</style></head><body>
<header><h1>Mahdi Repair – Manager</h1><button onclick="location.href='board.html'">Live board</button><button onclick="location.href='reception.html'">Reception desk</button><button onclick="location.href='technician.html'">Technician board</button><button onclick="location.href='pos.html'">POS</button><button onclick="location.href='inventory.html'">Inventory</button><button onclick="location.href='treasury.html'">Treasury</button><button onclick="location.href='stockmgmt.html'">Stock counts</button><button onclick="location.href='partsqueue.html'">Parts queue</button><button onclick="location.href='techreport.html'">Bonus report</button><button onclick="location.href='statistics.html'">Statistics</button><button onclick="location.href='suppliers.html'">Suppliers</button><button onclick="location.href='invoices.html'">Invoices</button><button onclick="location.href='admin.html'">Admin panel</button><button id="lo">Sign out</button></header>
<main><div class="kp" id="kp"></div>
<div class="g2"><div class="card"><b>Tickets by status</b><div id="bs"></div></div><div class="card"><b>Received, last 14 days</b><div class="cv" id="cv" style="margin-top:22px"></div></div>
<div class="card"><b>Stock alerts</b><p style="margin:8px 0 2px;color:var(--mut)">Low stock (2 or less)</p><div class="ls" id="lw"></div><p style="margin:12px 0 2px;color:var(--mut)">Parts needed</p><div class="ls" id="pn"></div><p style="margin:12px 0 2px;color:var(--mut)">Expiring within 60 days</p><div class="ls" id="ex"></div></div>
<div class="card"><b>Top debts</b><div class="ls" id="db"></div><b style="display:block;margin-top:14px">Recent activity</b><div class="ls" id="ac"></div></div></div></main>
<script type="module">
import {$,esc,db,start,money,canManage,role} from "./common.js";
import {collection,onSnapshot,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ST=[["received","Reception","#6b7c8a"],["diagnose","Diagnose","#c27a00"],["awaiting_approval","Waiting approval","#a44fb3"],["waiting_parts","Waiting parts","#8a5a3c"],["repair","Repair","#1f6fd1"],["ready","Ready for pickup","#1e8e4e"],["no_repair","Return without repair","#7a7a7a"],["returned","Returned","#14212b"]];
let T=[],P=[],A=[],D=[],Y=[],C=[],L=[],NE=[],RT=[],RG=[],CE=[],EX=[],LO=[];const num=v=>Number(v)||0,day=o=>new Date(Date.now()+o*864e5).toISOString().slice(0,10),ym=day(0).slice(0,7);
const sub=(c,f,q)=>onSnapshot(q||collection(db,c),s=>{f(s.docs.map(d=>({...d.data(),id:d.id})));draw()});
start(()=>{sub('tickets',x=>T=x);sub('parts',x=>P=x);sub('products',x=>A=x);sub('deliveries',x=>D=x);sub('payments',x=>Y=x);sub('customers',x=>C=x);sub('audit',x=>L=x,query(collection(db,'audit'),orderBy('at','desc'),limit(12)));sub('registers',x=>RG=x);sub('partNeeds',x=>NE=x);sub('returns',x=>RT=x);sub('cashEntries',x=>CE=x);sub('expenses',x=>EX=x,role==='admin'?null:query(collection(db,'expenses'),where('adminOnly','==',false)));sub('losses',x=>LO=x)});
const led=id=>{const d=D.filter(x=>x.customerId===id),r=RT.filter(x=>x.kind==='sale'&&x.customerId===id);return d.reduce((a,x)=>a+num(x.total)-num(x.paid),0)-Y.filter(p=>p.customerId===id).reduce((a,p)=>a+num(p.amount),0)-r.reduce((a,x)=>a+num(x.total)-num(x.refund&&x.refund.amount),0)};
const rows=a=>a.length?a.map(([l,r,c])=>`<div><span>${l}</span><span class="${c||''}">${r}</span></div>`).join(''):'<p style="color:var(--mut)">Nothing to show.</p>';
function draw(){const open=T.filter(t=>t.status!=='returned'),late=open.filter(t=>t.estDelivery&&t.estDelivery<day(0)&&t.status!=='ready'),
 done=T.filter(t=>t.status==='returned'),ret=t=>(t.history||[]).filter(h=>h.s==='returned').pop(),
 mo=done.filter(t=>ret(t)&&new Date(ret(t).t).toISOString().slice(0,7)===ym),rev=mo.reduce((a,t)=>a+(t.noRepair?num(t.noRepairFee):num(t.price)),0),
 spans=done.map(t=>ret(t)&&t.receivedDate?(ret(t).t-new Date(t.receivedDate))/864e5:null).filter(x=>x!=null&&x>=0),avg=spans.length?spans.reduce((a,b)=>a+b,0)/spans.length:0,
 pos=D.filter(d=>d.source==='pos'&&(d.date||'').startsWith(ym)),all=[...P,...A],debts=C.map(c=>({c,d:led(c.id)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
 const cost=all.reduce((a,p)=>a+num(p.qty)*num(p.buy),0),sp=all.reduce((a,p)=>a+num(p.qty)*(num(p.special)||(num(p.wholesale)+num(p.normal))/2),0);
 $('kp').innerHTML=[['Open tickets',open.length],['Late tickets',late.length,late.length?'low':''],['Avg. repair time',avg?avg.toFixed(1)+' d':'-'],['Repair revenue (month)',money(rev)],['POS sales (month)',money(pos.reduce((a,d)=>a+num(d.total),0))],['Customer debts',money(debts.reduce((a,x)=>a+x.d,0))],['Stock value (cost)',money(cost)],['Stock value (special price)',money(sp)],...(role==='admin'?[['Stock value (fixed price)',money(all.reduce((a,p)=>a+num(p.qty)*(num(p.fixed)||((num(p.normal)+(num(p.repair)||num(p.normal)))/2)),0))]]:[]),['Cash in registers',money(RG.reduce((a,r)=>a+num(r.initial)+CE.filter(e=>e.registerId===r.id).reduce((s,e)=>s+(e.kind==='in'?num(e.amount):-num(e.amount)),0),0))],['Expenses (month)',money(EX.filter(x=>(x.date||'').startsWith(ym)).reduce((a,x)=>a+num(x.ttc),0))],['Losses (month)',money(LO.filter(x=>(x.date||'').startsWith(ym)).reduce((a,x)=>a+num(x.total),0))],['Returns after repair (month)',T.filter(t=>t.isReturn&&new Date(t.returnAt||0).toISOString().slice(0,7)===ym).length],['Returned without repair (month)',T.filter(t=>t.noRepair&&new Date(t.noRepair.at||0).toISOString().slice(0,7)===ym).length],['Parts needed',NE.filter(n=>n.status==='open').length]].map(([l,v,c])=>`<div><b class="${c||''}">${v}</b><span>${l}</span></div>`).join('');
 const mx=Math.max(1,...ST.map(s=>T.filter(t=>t.status===s[0]).length));
 $('bs').innerHTML=ST.map(([k,l,c])=>{const n=T.filter(t=>t.status===k).length;return `<div class="br"><span>${l}</span><i style="--c:${c};width:${n/mx*100}%"></i><b>${n}</b></div>`}).join('');
 const days=[...Array(14)].map((_,i)=>day(i-13)),cn=days.map(d=>T.filter(t=>t.receivedDate===d).length),m2=Math.max(1,...cn);
 $('cv').innerHTML=cn.map((n,i)=>`<div style="height:${n/m2*100}%" title="${days[i]}"><small>${n||''}</small></div>`).join('');
 $('lw').innerHTML=rows(all.filter(p=>num(p.qty)<=2).sort((a,b)=>num(a.qty)-num(b.qty)).slice(0,10).map(p=>[esc(p.name),num(p.qty),num(p.qty)<=0?'low':'']));
 $('pn').innerHTML=rows(NE.filter(n=>n.status==='open').slice(0,8).map(n=>[esc(n.name)+(n.ticketCode?' <small>'+esc(n.ticketCode)+'</small>':''),'×'+n.qty,'low']));
 $('ex').innerHTML=rows(P.filter(p=>p.expiry&&num(p.qty)>0&&p.expiry<=day(60)).sort((a,b)=>a.expiry>b.expiry?1:-1).slice(0,8).map(p=>[esc(p.name),p.expiry,p.expiry<day(0)?'low':'']));
 $('db').innerHTML=rows(debts.slice(0,6).map(x=>[esc(x.c.name),money(x.d),'low']));
 $('ac').innerHTML=rows(L.map(l=>[`${esc(l.action)} <small>${esc(l.detail)}</small>`,`<small>${esc((l.by||'').split('@')[0])}</small>`]))}
</script></body></html>
