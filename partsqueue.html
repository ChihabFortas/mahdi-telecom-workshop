<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Parts queue</title>
<link rel="stylesheet" href="common.css"><style>td.n,th.n{text-align:end}.low{color:var(--bad);font-weight:600}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kp b{display:block;font-size:24px}.kp span{font-size:13px;color:var(--mut)}</style></head><body>
<header><h1>Mahdi Repair – Parts queue</h1><button onclick="location.href='inventory.html'">Inventory</button><button onclick="location.href='manager.html'">Manager overview</button><button id="lo">Sign out</button></header>
<main><div id="nf"></div><div class="kp" id="kp"></div><div class="tabs" id="tabs"></div>
<section id="t-rq"><div class="card"><table><thead><tr><th>Code</th><th>Device</th><th>Technician</th><th>Item</th><th class="n">Qty</th><th class="n">Stock now</th><th>Requested</th><th></th></tr></thead><tbody id="rq"></tbody></table></div></section>
<section id="t-is" hidden><div class="card"><table><thead><tr><th>Code</th><th>Device</th><th>Technician</th><th>Item</th><th class="n">Qty</th><th>Issued</th><th></th></tr></thead><tbody id="is"></tbody></table></div></section>
<section id="t-nd" hidden><div class="bar"><select id="sup"></select><button class="p" id="po" style="flex:0 0 auto">Create purchase order</button></div><div class="card"><table><thead><tr><th></th><th>Requested</th><th>Item</th><th class="n">Qty</th><th class="n">Stock now</th><th>For</th><th>Status</th><th></th></tr></thead><tbody id="nd"></tbody></table></div></section></main>
<script type="module">
import {$,esc,db,start,money,num,gen,nextNo,watchParts,logAudit,role,user,profile,thumb,locBadge} from "./common.js";
import {collection,onSnapshot,doc,setDoc,query,where,runTransaction,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let TK=[],P=[],A=[],NE=[],SU=[];const T=[['rq','Requests'],['is','Issued'],['nd','Parts needed']];$('tabs').innerHTML=T.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
const tab=k=>{T.forEach(([x])=>$('t-'+x).hidden=x!==k);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===k))};document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));tab('rq');
start(()=>{onSnapshot(query(collection(db,'tickets'),where('status','!=','returned')),s=>{TK=s.docs.map(d=>d.data());draw()});watchParts(p=>{P=p;draw()});onSnapshot(collection(db,'products'),s=>{A=s.docs.map(d=>({...d.data(),id:d.id}));draw()});
 onSnapshot(collection(db,'partNeeds'),s=>{NE=s.docs.map(d=>({...d.data(),id:d.id}));draw()});onSnapshot(collection(db,'suppliers'),s=>{SU=s.docs.map(d=>({...d.data(),id:d.id}));const v=$('sup').value;$('sup').innerHTML=SU.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('sup').value=v||(SU[0]||{}).id||''})});
const item=k=>P.find(x=>x.id===k)||A.find(x=>x.id===k),stock=k=>num((item(k)||{}).qty),img=k=>thumb(item(k)),flat=st=>TK.flatMap(t=>(t.items||[]).filter(i=>i.status===st).map(i=>({t,i})));
const when=ms=>ms?new Date(ms).toLocaleString():'',ts=n=>n.createdAt&&n.createdAt.toDate?n.createdAt.toDate().toLocaleString():'';
const NS={open:'Open',ordered:'Ordered',received:'Received',closed:'Closed'};
function draw(){const R=flat('requested').sort((a,b)=>num(a.i.requestedAt)-num(b.i.requestedAt)),I=flat('issued').sort((a,b)=>num(b.i.issuedAt)-num(a.i.issuedAt)),O=NE.filter(n=>n.status==='open');
 $('nf').innerHTML=O.length?`<div style="border-left:6px solid #c27a00;margin-bottom:14px;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line)"><b>🔔 <span>Parts needed</span> (${O.length})</b><div style="margin-top:4px">${O.slice(0,5).map(n=>`${esc(n.name)} ×${n.qty}${n.ticketCode?' · '+esc(n.ticketCode):''}`).join(' · ')}</div></div>`:'';
 $('kp').innerHTML=[['Requests',R.length],['Issued',I.length],['Out of stock',R.filter(({i})=>stock(i.sku)<num(i.qty)).length],['Parts needed',O.length]].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
 $('rq').innerHTML=R.map(({t,i})=>{const lk=t.status==='awaiting_approval',s=stock(i.sku),short=s<num(i.qty);return `<tr><td><b>${t.code}</b></td><td>${esc(t.model)}</td><td>${esc(t.techName||i.requestedByName||'')}</td><td><div style="display:flex;align-items:center">${img(i.sku)}<div>${esc(i.name)}<br><small>${esc(i.sku)}</small><br>${locBadge((item(i.sku)||{}).location)}</div></div></td><td class="n">${i.qty}</td><td class="n ${short?'low':''}">${s}</td><td>${when(i.requestedAt)}</td><td style="white-space:nowrap">${lk?'<small>Waiting approval</small>':`<button class="p" data-i="${t.code}|${esc(i.sku)}" ${short?'disabled':''}>Issue</button> <button class="d" data-x="${t.code}|${esc(i.sku)}">Decline</button>`}</td></tr>`}).join('')||'<tr><td colspan="8">Nothing to show.</td></tr>';
 $('is').innerHTML=I.map(({t,i})=>`<tr><td><b>${t.code}</b></td><td>${esc(t.model)}</td><td>${esc(t.techName||'')}</td><td>${esc(i.name)}<br><small>${esc(i.sku)}</small></td><td class="n">${i.qty}</td><td>${esc(i.issuedByName||'')} · ${when(i.issuedAt)}</td><td><button data-b="${t.code}|${esc(i.sku)}">Take back</button></td></tr>`).join('')||'<tr><td colspan="7">Nothing to show.</td></tr>';
 const go=(sel,from,fn,act)=>document.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{const [c,k]=b.dataset[sel.slice(6,-1)].split('|');try{await mutate(c,k,from,fn());logAudit(act,c+' · '+k);if(act==='parts.issue'||act==='parts.takeback'){const p=item(k),t=TK.find(x=>x.code===c),it=((t||{}).items||[]).find(x=>x.sku===k)||{};await setDoc(doc(collection(db,'movements')),{partId:k,inv:p&&P.find(x=>x.id===k)?'parts':'products',name:p?p.name:k,model:p?p.model:'',type:act==='parts.issue'?'issue':'takeback',qty:0,balance:stock(k),ref:c,note:'×'+(it.qty||'')+' · '+((t||{}).techName||''),by:user.email,at:serverTimestamp()})}}catch(e){alert(e.message)}});
 go('[data-i]','requested',()=>i=>({...i,status:'issued',issuedBy:user.email,issuedByName:(profile&&profile.name)||user.email,issuedAt:Date.now()}),'parts.issue');
 go('[data-x]','requested',()=>i=>({...i,status:'declined',declinedBy:user.email,declinedAt:Date.now()}),'parts.decline');
 go('[data-b]','issued',()=>i=>({...i,status:'quoted',takenBackAt:Date.now()}),'parts.takeback');
 const N=[...NE].filter(n=>['open','ordered','received'].includes(n.status)).sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1));
 $('nd').innerHTML=N.map(n=>`<tr><td>${n.status==='open'&&n.sku?`<input type="checkbox" data-n="${n.id}" style="width:auto">`:''}</td><td>${ts(n)}</td><td>${esc(n.name)}<br><small>${esc(n.sku||'')} ${n.sku?'':'<i>(not in catalog)</i>'}</small></td><td class="n">${n.qty}</td><td class="n">${n.sku?stock(n.sku):'-'}</td><td>${n.source==='workshop'?esc(n.ticketCode||'')+' · '+esc(n.model||''):esc(n.customerName||'')+' '+esc(n.customerPhone||'')+' '+esc(n.model||'')}<br><small>${esc(n.requestedByName||'')} ${n.note?'· '+esc(n.note):''}</small></td><td>${NS[n.status]}${n.poNo?'<br><small>'+esc(n.poNo)+'</small>':''}</td><td>${n.status==='open'?`<button class="d" data-c="${n.id}">Decline</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">Nothing to show.</td></tr>';
 $('nd').querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{await setDoc(doc(db,'partNeeds',b.dataset.c),{status:'closed',closedAt:Date.now()},{merge:true});logAudit('part.need.close',b.dataset.c)})}
async function mutate(code,sku,from,fn){await runTransaction(db,async tx=>{const r=doc(db,'tickets',code),s=await tx.get(r);if(!s.exists())throw new Error('Ticket not found');const it=(s.data().items||[]).map(i=>i.sku===sku&&i.status===from?fn(i):i);tx.update(r,{items:it,updatedAt:serverTimestamp()})})}
$('po').onclick=async()=>{const ids=[...document.querySelectorAll('[data-n]:checked')].map(x=>x.dataset.n),sp=SU.find(s=>s.id===$('sup').value);if(!sp){alert('Create a supplier first.');return}if(!ids.length){alert('Nothing to show.');return}
 const sel=NE.filter(n=>ids.includes(n.id)),g={};sel.forEach(n=>{const it=item(n.sku),l=g[n.sku]||(g[n.sku]={sku:n.sku,name:n.name,col:n.col||(P.find(x=>x.id===n.sku)?'parts':'products'),qty:0,price:num(it&&it.buy),received:0});l.qty+=num(n.qty)});
 const lines=Object.values(g);try{const no=await nextNo('PO'),id=gen('PO'),b=writeBatch(db);
  b.set(doc(db,'purchaseOrders',id),{no,date:new Date().toISOString().slice(0,10),expected:'',supplierId:sp.id,supplierName:sp.name,lines,total:lines.reduce((a,l)=>a+l.qty*l.price,0),status:'open',notes:'From parts needed',by:user.email,createdAt:serverTimestamp()});
  sel.forEach(n=>b.set(doc(db,'partNeeds',n.id),{status:'ordered',poNo:no,orderedAt:Date.now()},{merge:true}));await b.commit();logAudit('po.create',no+' · from needs');alert(no)}catch(e){alert(e.message)}};
</script></body></html>
