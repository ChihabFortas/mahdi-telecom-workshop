<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – CRM dashboard</title>
<link rel="stylesheet" href="common.css"><style>
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.k2{--c:#2563eb;background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 20%,var(--line));border-radius:16px;padding:16px 18px}.k2 span{color:var(--mut);font-size:14px;display:block}.k2 b{display:block;font-size:32px;line-height:1.15;margin-top:6px}.k2 em{font-style:normal;display:inline-block;margin-top:6px;padding:2px 10px;border-radius:8px;background:color-mix(in srgb,var(--c) 82%,#000);color:#fff;font-size:12.5px;font-weight:600}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;margin-bottom:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}.panel h3{margin:0 0 12px;font-size:16px}
.hb{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:14px}.hb .tr{display:flex;height:14px;border-radius:7px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent)}.hb .tr i{display:block;height:100%}
.vb{display:flex;align-items:flex-end;gap:8px;height:150px}.vb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mut);height:100%}.vb i{display:block;width:100%}.stars{color:#f59e0b;letter-spacing:1px}.cm{padding:9px 0;border-bottom:1px solid var(--line)}.cm small{color:var(--mut)}td.n,th.n{text-align:end}@media(max-width:700px){.kg{grid-template-columns:repeat(2,1fr)!important;gap:10px}.k2{padding:12px 14px}.k2 b{font-size:26px}.k2 span{font-size:13px}.k2 em{font-size:11.5px}}
</style></head><body><main>
<div class="bar"><select id="pp"><option value="month">This month</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="year">This year</option><option value="all">All</option></select></div>
<div class="kg" id="kg"></div>
<div class="cg"><div class="panel"><h3>Satisfaction</h3><div id="rt"></div></div><div class="panel"><h3>Incomplete repairs</h3><div id="ic"></div></div><div class="panel"><h3>Customers</h3><div class="vb" id="vb"></div><div id="vl" style="display:flex;gap:14px;font-size:13px;margin-top:8px"></div></div></div>
<div class="cg"><div class="panel"><h3>Technician</h3><table style="min-width:0"><thead><tr><th>Technician</th><th class="n">Repaired</th><th class="n">Returns</th><th class="n">Rating</th></tr></thead><tbody id="tt"></tbody></table></div><div class="panel"><h3>Top customers</h3><table style="min-width:0"><thead><tr><th>Customer</th><th class="n">Visits</th><th class="n">Total</th></tr></thead><tbody id="tc"></tbody></table></div><div class="panel"><h3>Customer comments</h3><div id="cm"></div></div></div></main>
<script type="module">
import {$,esc,db,start,money,num,norm,STATUS} from "./common.js";
import {collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let T=[],FB=[];const fm=money,day=o=>new Date(Date.now()+o*864e5).toISOString().slice(0,10),pc=(a,b)=>b?Math.round(a/b*100)+'%':'–',key=t=>String(t.phone||'').replace(/\D/g,'')||('n:'+norm((t.firstName||'')+(t.lastName||'')));
start(()=>{onSnapshot(collection(db,'tickets'),s=>{T=s.docs.map(d=>d.data());draw()});onSnapshot(collection(db,'feedback'),s=>{FB=s.docs.map(d=>d.data());draw()},()=>{})});$('pp').onchange=draw;
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n)),k2=(l,v,c,sub)=>`<div class="k2" style="--c:${c}"><span>${l}</span><b>${v}</b>${sub?`<em>${sub}</em>`:''}</div>`;
function draw(){const p=$('pp').value,st=p==='month'?day(0).slice(0,8)+'01':p==='30'?day(-30):p==='90'?day(-90):p==='year'?day(0).slice(0,5)+'01-01':'',inP=t=>!st||(t.receivedDate||'')>=st;
 const P=T.filter(inP),base=P.filter(t=>!t.isReturn),cnt={};T.filter(t=>!t.isReturn).forEach(t=>{const k=key(t);cnt[k]=(cnt[k]||0)+1});
 const ph=[...new Set(P.map(key))],rep=ph.filter(k=>cnt[k]>1),ret=P.filter(t=>t.isReturn),nr=P.filter(t=>t.noRepair),done=P.filter(t=>t.repairedAt&&!t.noRepair),closed=done.length+nr.length;
 const qh=P.flatMap(t=>t.quoteHistory||[]),qa=qh.filter(x=>x.status==='approved').length,qr=qh.filter(x=>x.status==='rejected').length;
 const days=done.map(t=>{const h=(t.history||[]).find(x=>x.s==='received');const s0=h?h.t:new Date(t.receivedDate).getTime();return (t.repairedAt-s0)/864e5}).filter(x=>x>=0),avg=days.length?days.reduce((a,b)=>a+b,0)/days.length:0,ot=done.filter(t=>t.estDelivery&&new Date(t.repairedAt).toISOString().slice(0,10)<=t.estDelivery).length,otd=done.filter(t=>t.estDelivery).length;
 const codes=new Set(P.map(t=>t.code)),F=FB.filter(f=>codes.has(f.code)),av=F.length?F.reduce((a,f)=>a+f.rating,0)/F.length:0,sat=F.filter(f=>f.rating>=4).length;
 const ready=P.filter(t=>['ready','returned','no_repair'].includes(t.status)),nt=ready.filter(t=>t.notifiedAt).length;
 $('kg').innerHTML=[k2('Customers served',ph.length,'#2563eb',pc(rep.length,ph.length)+' repeat'),k2('Repeat customers',rep.length,'#0ea5e9'),k2('Returns after repair',ret.length,'#b45309',pc(ret.length,base.length)+' of repairs'),k2('Incomplete repairs',nr.length,'#6b7280',pc(nr.length,closed)),k2('Completion rate',pc(done.length,closed),'#16a34a'),k2('Quote approval',pc(qa,qa+qr),'#a855f7',qa+'/'+(qa+qr)),k2('Avg repair time',avg?avg.toFixed(1)+' d':'–','#0ea5e9'),k2('On-time delivery',pc(ot,otd),'#16a34a'),k2('Average rating',F.length?av.toFixed(1)+' ★':'–','#f59e0b',F.length+' reviews'),k2('Satisfied (4–5 ★)',pc(sat,F.length),'#16a34a'),k2('Review rate',pc(F.length,closed),'#64748b'),k2('Customers notified',pc(nt,ready.length),'#0ea5a5')].join('');
 const dist=[5,4,3,2,1].map(s=>[s,F.filter(f=>f.rating===s).length]),mx=Math.max(1,...dist.map(x=>x[1]));
 $('rt').innerHTML=F.length?`<div style="font-size:30px;font-weight:700">${av.toFixed(1)} <span class="stars">${stars(av)}</span></div>`+dist.map(([s,c])=>`<div class="hb"><span class="stars">${'★'.repeat(s)}</span><div class="tr"><i style="width:${c/mx*100}%;background:#f59e0b"></i></div><b>${c}</b></div>`).join(''):'<p style="color:var(--mut)">Nothing to show.</p>';
 const RS={unrepairable:'Unrepairable',high_price:'High price',data_loss:'Data loss',part_unavailable:'Part unavailable',diagnosis_only:'Diagnosis only'},rc=Object.keys(RS).map(k=>[k,nr.filter(t=>t.noRepair.reason===k).length]),m2=Math.max(1,...rc.map(x=>x[1]));
 $('ic').innerHTML=nr.length?rc.map(([k,c])=>`<div class="hb"><span>${RS[k]}</span><div class="tr"><i style="width:${c/m2*100}%;background:#6b7280"></i></div><b>${c}</b></div>`).join(''):'<p style="color:var(--mut)">Nothing to show.</p>';
 // customers per month: new vs repeat
 const first={};T.filter(t=>!t.isReturn).forEach(t=>{const k=key(t),d=t.receivedDate||'';if(!(k in first)||d<first[k])first[k]=d});
 const ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)}),mc=ms.map(m=>{const s=new Set(T.filter(t=>(t.receivedDate||'').startsWith(m)).map(key)),n=[...s].filter(k=>(first[k]||'').startsWith(m)).length;return [m,n,s.size-n]}),mm=Math.max(1,...mc.map(x=>x[1]+x[2]));
 $('vb').innerHTML=mc.map(([m,n,r])=>`<div title="${m}">${n+r||''}<i style="height:${r/mm*100}%;background:#0ea5e9"></i><i style="height:${n/mm*100}%;background:#2563eb"></i><span>${m.slice(5)}</span></div>`).join('');$('vl').innerHTML='<span><b style="color:#2563eb">■</b> <span>New</span></span><span><b style="color:#0ea5e9">■</b> <span>Repeat</span></span>';
 // technicians
 const tg={};done.forEach(t=>{const k=t.repairedBy||t.techId||'?',x=tg[k]||(tg[k]={n:t.repairedByName||t.techName||'–',r:0,rt:0,s:0,c:0});x.r++});ret.forEach(t=>{const k=t.origTechId||'?',x=tg[k]||(tg[k]={n:t.origTechName||'–',r:0,rt:0,s:0,c:0});x.rt++});
 F.forEach(f=>{const t=P.find(y=>y.code===f.code);if(!t)return;const k=t.repairedBy||t.techId||'?',x=tg[k];if(x){x.s+=f.rating;x.c++}});
 $('tt').innerHTML=Object.values(tg).sort((a,b)=>b.r-a.r).map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${x.r}</td><td class="n">${x.rt}</td><td class="n">${x.c?(x.s/x.c).toFixed(1)+' ★':'–'}</td></tr>`).join('')||'<tr><td colspan="4">Nothing to show.</td></tr>';
 const cg={};P.forEach(t=>{const k=key(t),x=cg[k]||(cg[k]={n:(t.firstName||'')+' '+(t.lastName||''),v:0,s:0});x.v++;if(t.status==='returned'&&!t.noRepair)x.s+=num(t.price)});
 $('tc').innerHTML=Object.values(cg).sort((a,b)=>b.v-a.v||b.s-a.s).slice(0,8).map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${x.v}</td><td class="n">${fm(x.s)}</td></tr>`).join('')||'<tr><td colspan="3">Nothing to show.</td></tr>';
 $('cm').innerHTML=F.filter(f=>f.comment).sort((a,b)=>(b.createdAt&&b.createdAt.seconds||0)-(a.createdAt&&a.createdAt.seconds||0)).slice(0,8).map(f=>{const t=P.find(y=>y.code===f.code)||{};return `<div class="cm"><span class="stars">${stars(f.rating)}</span> <small>${esc(t.model||'')} · ${esc(f.code)}</small><br>${esc(f.comment)}</div>`}).join('')||'<p style="color:var(--mut)">Nothing to show.</p>'}
</script></body></html>
