<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahdi Repair – Reception</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--ink:#14212b;--mut:#5d6b77;--bg:#eef1f4;--card:#fff;--ac:#0f7b7b;--line:#d9e0e6;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--hdr,var(--ink));color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 12px;color:var(--ink)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button.d{color:var(--bad)}header button{background:transparent;color:#fff;border-color:#4a5b68}
main{max-width:1200px;margin:0 auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{color:var(--mut);font-size:13px}.stat.on{outline:2px solid var(--c)}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:220px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600;background:#f7f9fa}tr:last-child td{border:0}tr.late td:nth-child(6){color:var(--bad);font-weight:600}
td select{padding:5px;width:auto;border-left:4px solid var(--c)}.acts{display:flex;gap:6px}.acts button{padding:5px 9px;font-size:13px}.empty{padding:30px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,96vw)}dialog::backdrop{background:#0008}
form.m{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}form.m h2{grid-column:1/-1;margin:0}.w{grid-column:1/-1}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}.fa{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:14px;display:grid;gap:12px}#login h2{margin:0}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}body{background:#fff}}
#pa .rc{width:80mm;height:50mm;padding:2mm;font:9px/1.25 Arial,sans-serif;color:#000;overflow:hidden;display:grid;grid-template-columns:1fr 17mm;gap:1mm;align-content:start}
#pa .rc h3{margin:0;font-size:11px;grid-column:1/-1;display:flex;justify-content:space-between}#pa .rc svg.bc{grid-column:1/-1;width:100%;height:11mm}
#pa .lb{width:45mm;height:35mm;padding:1.5mm;font:8px/1.2 Arial,sans-serif;color:#000;overflow:hidden;text-align:center}
#pa .lb svg{width:100%;height:12mm}#pa b{font-weight:700}
</style></head><body>
<div id="app">
<header><h1>Mahdi Repair – Reception</h1><button onclick="location.href='board.html'">Live board</button><button onclick="location.href='pos.html'">POS</button><button onclick="location.href='invoices.html'">Invoices</button><button onclick="location.href='inventory.html'">Inventory</button><button onclick="location.href='quotes.html'" style="background:#0f7b7b;border-color:#0f7b7b">New quote</button><button id="rr">↩ Return after repair</button><button id="rp">Request a part</button><button id="nw" class="p" style="background:var(--ac)">+ New ticket</button><button id="lo">Sign out</button></header>
<main><div id="nf"></div><div id="nf2"></div><div class="stats" id="stats"></div>
<div class="bar"><input id="s" placeholder="Search name, phone, model or code"><label style="align-self:center;display:flex;gap:6px;align-items:center;color:var(--ink)"><input id="hr" type="checkbox" style="width:auto"> Hide returned</label></div>
<div class="tbl"><table><thead><tr><th>Code</th><th>Customer</th><th>Phone</th><th>Problem</th><th>Status</th><th>Est. delivery</th><th>Price</th><th>Level</th><th>Technician</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main>
<dialog id="dlg"><form class="m" id="f"><h2 id="ft">New ticket</h2>
<div><label>First name</label><input name="firstName" required></div><div><label>Last name</label><input name="lastName" required></div>
<div><label>Phone number</label><input name="phone" type="tel" required></div><div><label>Phone model</label><input name="model" required></div>
<div><label>Color</label><input name="color"></div><div><label>Repair price</label><input name="price" type="number" step="0.01" min="0"></div>
<div id="dvk" class="w"></div>
<div class="w"><label>Problem</label><textarea name="problem" rows="2" required></textarea></div>
<div><label>Date received</label><input name="receivedDate" type="date" required></div><div><label>Estimated delivery</label><input name="estDelivery" type="date"></div>
<div class="w"><label>Status</label><select name="status"></select></div><div><label>Repair level</label><select name="level"><option value="0">0 – Basic</option><option value="1" selected>1 – Normal</option><option value="2">2 – Difficult</option><option value="3">3 – Most difficult</option></select></div><div><label>Technician</label><select name="techId" id="ttech"><option value="">Unassigned</option></select></div>
<div class="fa"><button type="button" id="cx">Cancel</button><button class="p" id="sv">Save</button><button type="button" class="p" id="sp" style="background:#14212b">Save &amp; print</button></div></form></dialog>
</div><dialog id="rrd"><form class="m" id="rrf"><h2>Return after repair</h2><div class="w"><label>Customer name or phone</label><input id="rrq" autocomplete="off"></div><div class="w" id="rrl"></div>
<div class="w" id="rrx" style="display:none"><b id="rrs"></b></div><div id="rrf1" style="display:none;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:12px"><div><label>Return reason</label><select name="kind"><option value="same">Same problem</option><option value="other">Another problem</option></select></div><div><label>Repair level</label><select name="level"><option value="0">0 – Basic</option><option value="1">1 – Normal</option><option value="2">2 – Difficult</option><option value="3">3 – Most difficult</option></select></div>
<div><label>Technician</label><select name="techId" id="rrt"></select></div><div><label>Estimated delivery</label><input name="est" type="date"></div><div class="w"><label>Note</label><textarea name="note" rows="2" required></textarea></div></div>
<div class="fa"><button type="button" id="rrc">Cancel</button><button class="p" id="rrb" disabled>Create ticket &amp; print receipt</button></div></form></dialog>
<dialog id="rpd"><form class="m" id="rpf"><h2>Request a part</h2><div class="w"><label>Part</label><input name="item" list="rpl" required autocomplete="off"></div><datalist id="rpl"></datalist><div><label>Qty</label><input name="qty" type="number" min="1" value="1" required></div><div><label>Phone model</label><input name="model"></div><div><label>Customer</label><input name="cname"></div><div><label>Phone number</label><input name="cphone" type="tel"></div><div class="w"><label>Note</label><textarea name="note" rows="2"></textarea></div><div class="fa"><button type="button" id="rpc">Cancel</button><button class="p">Save</button></div></form></dialog>
<dialog id="nrd"><form class="m" id="nrf"><h2>Return without repair</h2><p class="w" id="nrn" style="margin:0;font-weight:700"></p><div class="w"><label>Detail</label><select name="reason"><option value="high_price">High price</option><option value="data_loss">Customer doesn't want to lose data</option><option value="part_unavailable">Part unavailable – customer does not want to wait</option><option value="diagnosis_only">Customer wants diagnosis only</option></select></div><div class="w"><label>Note</label><textarea name="note" rows="2"></textarea></div><div class="fa"><button type="button" id="nrc">Cancel</button><button class="p">Save</button></div></form></dialog>
<div id="pa"></div>
<script type="module">
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,arrayUnion,arrayRemove,serverTimestamp,where,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {$,gen,num,norm,db,SHOP,start,logAudit,money,canManage,user,profile,DEV_HTML,devKit,devLine,trackUrl,waLink,smsLink,markNotified,watchShopCfg} from "./common.js";
const ST=[["received","Reception","#6b7c8a"],["diagnose","Diagnose","#c27a00"],["awaiting_approval","Waiting approval","#a44fb3"],["waiting_parts","Waiting parts","#8a5a3c"],["repair","Repair","#1f6fd1"],["ready","Ready for pickup","#1e8e4e"],["no_repair","Return without repair","#7a7a7a"],["returned","Returned","#14212b"]];
const SM=Object.fromEntries(ST.map(s=>[s[0],s])),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('dvk').innerHTML=DEV_HTML;const dv=devKit($('dvk'));
let CFG={};watchShopCfg(c=>{CFG=c});let rcv=[],techs=[],pend=[],lastN=null,tickets=[],filter='all',unsub;
const pk=p=>String(p||'').replace(/\D/g,''),today=()=>new Date().toISOString().slice(0,10);
start(()=>{onSnapshot(collection(db,'technicians'),s=>{techs=s.docs.map(d=>({...d.data(),id:d.id})).filter(x=>x.active!==false);const v=$('ttech').value;$('ttech').innerHTML='<option value="">Unassigned</option>'+techs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('ttech').value=v});
 onSnapshot(query(collection(db,'partNeeds'),where('source','==','reception'),where('status','==','received')),s=>{rcv=s.docs.map(d=>({...d.data(),id:d.id}));drawRcv()});
 onSnapshot(query(collection(db,'tickets'),where('status','==','awaiting_approval')),s=>{pend=s.docs.map(d=>d.data()).filter(t=>t.pendingQuote);if(lastN!==null&&pend.length>lastN)beep();lastN=pend.length;drawNf()});
 unsub=onSnapshot(query(collection(db,'tickets'),orderBy('createdAt','desc')),s=>{tickets=s.docs.map(d=>d.data());render();const pc=new URLSearchParams(location.search).get('print');if(pc&&tickets.find(x=>x.code===pc)){history.replaceState(null,'','index.html');print('rc',tickets.find(x=>x.code===pc))}})});
function render(){
 const q=$('s').value.toLowerCase(),cnt=k=>tickets.filter(t=>t.status===k).length;
 $('stats').innerHTML=`<button class="stat ${filter==='all'?'on':''}" style="--c:#14212b" data-f="all"><b>${tickets.length}</b><span>All tickets</span></button>`+ST.map(([k,l,c])=>`<button class="stat ${filter===k?'on':''}" style="--c:${c}" data-f="${k}"><b>${cnt(k)}</b><span>${l}</span></button>`).join('');
 document.querySelectorAll('.stat').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
 const list=tickets.filter(t=>(filter==='all'||t.status===filter)&&!($('hr').checked&&filter==='all'&&t.status==='returned')&&(!q||[t.code,t.firstName,t.lastName,t.phone,t.model,t.techName].join(' ').toLowerCase().includes(q)));
 $('rows').innerHTML=list.length?list.map(t=>{const late=t.estDelivery&&t.estDelivery<today()&&!['ready','returned'].includes(t.status);
 return `<tr class="${late?'late':''}"><td><b>${t.code}</b>${t.isReturn?' <span class="bd" style="background:#fdf0d5;color:#8a5a00">↩ Return</span>':''}${(t.returnCodes||[]).length?' <span class="bd">↩ ×'+t.returnCodes.length+'</span>':''}</td><td>${esc(t.firstName)} ${esc(t.lastName)}</td><td>${esc(t.phone)}</td><td>${esc(t.model)} ${esc(t.color)}<br><small>${esc(t.problem)}</small></td>
 <td><select data-s="${t.code}" style="--c:${SM[t.status][2]}">${ST.map(s=>`<option value="${s[0]}" ${s[0]===t.status?'selected':''}>${s[1]}</option>`).join('')}</select></td>
 <td>${t.estDelivery||'-'}${late?' (late)':''}</td><td>${t.price!=null&&t.price!==''?money(t.price):'-'}</td><td>${t.level==null?'-':'L'+t.level}</td><td>${esc(t.techName||'')}</td>
 <td class="acts"><button data-e="${t.code}">Edit</button>${['ready','no_repair'].includes(t.status)?`<button class="p" data-wa="${t.code}">WhatsApp</button><button data-sm="${t.code}">SMS</button>`:''}<button data-q="${t.code}">Parts &amp; quote</button><button data-r="${t.code}">Receipt</button><button data-l="${t.code}">Label</button>${canManage()?`<button class="d" data-x="${t.code}">Delete</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">No tickets here. Click “New ticket” to add one.</td></tr>';
 const g=a=>tickets.find(t=>t.code===a);
 document.querySelectorAll('[data-s]').forEach(e=>e.onchange=()=>setStatus(e.dataset.s,e.value));
 document.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>openForm(g(e.dataset.e)));
 document.querySelectorAll('[data-wa]').forEach(e=>e.onclick=()=>{const t=g(e.dataset.wa);window.open(waLink(t,CFG,t.status==='no_repair'?'nr':'ready'),'_blank');markNotified(t,'whatsapp')});document.querySelectorAll('[data-sm]').forEach(e=>e.onclick=()=>{const t=g(e.dataset.sm);markNotified(t,'sms');location.href=smsLink(t,CFG,t.status==='no_repair'?'nr':'ready')});
 document.querySelectorAll('[data-q]').forEach(e=>e.onclick=()=>location.href='quote.html?code='+e.dataset.q);
 document.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>print('rc',g(e.dataset.r)));
 document.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>print('lb',g(e.dataset.l)));
 document.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>del(g(e.dataset.x)));
}
$('s').oninput=render;$('hr').onchange=render;
$('f').status.innerHTML=ST.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
let editing=null,after=null;
function openForm(t){editing=t||null;const f=$('f');f.reset();$('ft').textContent=t?`Edit ${t.code}`:'New ticket';
 if(t)['firstName','lastName','phone','model','color','price','problem','receivedDate','estDelivery','status','level','techId'].forEach(k=>f[k].value=t[k]??'');
 else{f.receivedDate.value=today();f.status.value='received';f.level.value='1'}dv.set(t?t.device:null);$('dlg').showModal()}
$('nw').onclick=()=>openForm();$('cx').onclick=()=>$('dlg').close();
$('sp').onclick=()=>{after=true;$('f').requestSubmit()};$('sv').onclick=()=>{after=false};
const track=t=>({code:t.code,firstName:t.firstName,model:t.model+(t.color?' ('+t.color+')':''),problem:t.problem,status:t.status,price:t.price??null,priceText:t.price!=null&&t.price!==''?money(t.price):'',receivedDate:t.receivedDate,estDelivery:t.estDelivery||'',phone:t.phone});
async function sync(t,oldPhone){
 await setDoc(doc(db,'tracking',t.code),track(t));
 if(oldPhone&&pk(oldPhone)!==pk(t.phone))await setDoc(doc(db,'trackingPhone',pk(oldPhone)),{codes:arrayRemove(t.code)},{merge:true});
 await setDoc(doc(db,'trackingPhone',pk(t.phone)),{codes:arrayUnion(t.code)},{merge:true})}
$('f').onsubmit=async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
 v.price=v.price===''?null:Number(v.price);v.level=Number(v.level)||0;v.device=dv.get();const tc=techs.find(x=>x.id===v.techId);v.techName=tc?tc.name:'';if(v.techId!==((editing&&editing.techId)||''))v.assignedAt=Date.now();let t;
 try{if(editing){t={...editing,...v};const h=editing.status!==v.status?{history:arrayUnion({s:v.status,t:Date.now()})}:{};
   await updateDoc(doc(db,'tickets',t.code),{...v,...h,updatedAt:serverTimestamp()});await sync(t,editing.phone)}
  else{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='RD-';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];
   t={...v,code:c};await setDoc(doc(db,'tickets',c),{...t,history:[{s:v.status,t:Date.now()}],createdAt:serverTimestamp()});await sync(t)}
  logAudit(editing?'ticket.update':'ticket.create',t.code);$('dlg').close();if(after)print('rc',t)}catch(err){alert('Could not save: '+err.message)}};
async function setStatus(code,s){const t=tickets.find(x=>x.code===code);let fee;if(s==='returned'&&t.noRepair){const f=prompt('Diagnosis fee (0 if none):','0');if(f===null){render();return}fee=Number(f)||0}
 await updateDoc(doc(db,'tickets',code),{status:s,...(fee!==undefined?{noRepairFee:fee}:{}),history:arrayUnion({s,t:Date.now()}),updatedAt:serverTimestamp()});await sync({...t,status:s});logAudit('ticket.status',code+' → '+s)}
async function del(t){if(!confirm(`Delete ticket ${t.code} for ${t.firstName} ${t.lastName}? This cannot be undone.`))return;
 await deleteDoc(doc(db,'tickets',t.code));logAudit('ticket.delete',t.code);await deleteDoc(doc(db,'tracking',t.code));
 await setDoc(doc(db,'trackingPhone',pk(t.phone)),{codes:arrayRemove(t.code)},{merge:true})}
function print(kind,t){const url=trackUrl(t),qr=qrcode(0,'M');qr.addData(url);qr.make();
 const pa=$('pa'),size=kind==='rc'?'80mm 50mm':'45mm 35mm';
 pa.innerHTML=kind==='rc'?`<div class="rc"><h3><span>${esc(SHOP.name)}</span><span>${esc(SHOP.phone)}</span></h3>
  <div><b>${t.code}</b><br>${esc(t.firstName)} ${esc(t.lastName)} · ${esc(t.phone)}<br><b>${esc(t.model)}</b> ${esc(t.color)}<br>${esc(t.problem).slice(0,60)}<br>${devLine(t)}<br>In: ${t.receivedDate} · Est: ${t.estDelivery||'-'}<br><b>Price: ${t.price!=null&&t.price!==''?money(t.price):'TBD'}</b></div>
  <div style="text-align:center">${qr.createSvgTag({cellSize:2,margin:0,scalable:true})}<div style="font-size:6px;line-height:1">Scan to track</div></div><svg class="bc"></svg></div>`
  :`<div class="lb"><b>${t.code}</b><svg class="bc"></svg>${esc(t.model)} ${esc(t.color)}<br>${esc(t.firstName)} ${esc(t.lastName)}<br>${t.receivedDate} → ${t.estDelivery||'-'}</div>`;
 JsBarcode(pa.querySelector('svg.bc'),t.code,{format:'CODE128',displayValue:kind==='lb',fontSize:10,margin:0,height:40,width:2});
 pa.querySelector('svg.bc').setAttribute('preserveAspectRatio','none');
 let st=document.getElementById('ps');if(!st){st=document.createElement('style');st.id='ps';document.head.appendChild(st)}
 st.textContent=`@page{size:${size};margin:0}`;setTimeout(()=>window.print(),150)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},250)}catch(e){}}
function drawNf(){document.title=(pend.length?`(${pend.length}) `:'')+'Mahdi Repair – Reception';
 $('nf').innerHTML=pend.length?`<div class="card" style="border-left:6px solid #a44fb3;margin-bottom:14px;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line)"><b>🔔 <span>Price change requests</span> (${pend.length})</b>`+pend.map(t=>{const q=t.pendingQuote;return `<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${t.code}</b> · ${esc(t.model)} · ${esc(t.firstName)} ${esc(t.lastName)} · <a href="tel:${esc(t.phone)}">${esc(t.phone)}</a><br><small>${esc(q.byName||'')} · ${new Date(q.at).toLocaleString()}</small><br><span>Old price:</span> <b>${money(q.oldPrice!=null?q.oldPrice:t.price)}</b> → <span>New price:</span> <b>${money(q.price)}</b><br>${esc(q.note||'')}<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button data-nc="${t.code}">${q.contacted?'✓ Customer contacted':'Mark contacted'}</button><button class="p" data-na="${t.code}">Approve new price</button><button class="d" data-nr="${t.code}">Reject</button><button data-nd="${t.code}">Customer declined</button></div></div>`}).join('')+'</div>':'';
 const g=c=>pend.find(t=>t.code===c);
 $('nf').querySelectorAll('[data-nc]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'tickets',b.dataset.nc),{'pendingQuote.contacted':true,'pendingQuote.contactedBy':user.email,'pendingQuote.contactedAt':Date.now(),updatedAt:serverTimestamp()}));
 $('nf').querySelectorAll('[data-na]').forEach(b=>b.onclick=async()=>{const t=g(b.dataset.na),q=t.pendingQuote,p=prompt('Confirmed new price:',q.price);if(p===null)return;const price=Number(p);if(!(price>=0)){alert('Amount');return}
  try{await updateDoc(doc(db,'tickets',t.code),{price,status:'repair',pendingQuote:null,quoteHistory:arrayUnion({price,oldPrice:q.oldPrice!=null?q.oldPrice:(t.price!=null?t.price:null),note:q.note||'',by:q.byName||'',at:q.at,status:'approved',decidedBy:user.email,decidedAt:Date.now()}),history:arrayUnion({s:'repair',t:Date.now()}),updatedAt:serverTimestamp()});
   await updateDoc(doc(db,'tracking',t.code),{price,priceText:money(price),status:'repair'});logAudit('quote.approve',t.code+' · '+money(price))}catch(x){alert(x.message)}});
 $('nf').querySelectorAll('[data-nd]').forEach(b=>b.onclick=()=>openNR(g(b.dataset.nd)));
 $('nf').querySelectorAll('[data-nr]').forEach(b=>b.onclick=async()=>{const t=g(b.dataset.nr),q=t.pendingQuote;if(!confirm('Reject'+' ?'))return;
  try{await updateDoc(doc(db,'tickets',t.code),{status:'repair',pendingQuote:null,quoteHistory:arrayUnion({price:q.price,oldPrice:q.oldPrice!=null?q.oldPrice:null,note:q.note||'',by:q.byName||'',at:q.at,status:'rejected',decidedBy:user.email,decidedAt:Date.now()}),history:arrayUnion({s:'repair',t:Date.now()}),updatedAt:serverTimestamp()});
   await updateDoc(doc(db,'tracking',t.code),{status:'repair'});logAudit('quote.reject',t.code)}catch(x){alert(x.message)}})}
// ---- return after repair
let rrSel=null;
function rrFind(){const q=norm($('rrq').value),k=q.replace(/\D/g,'');if(q.length<2){$('rrl').innerHTML='';return}
 const L=tickets.filter(t=>norm((t.firstName||'')+' '+(t.lastName||'')).includes(q)||(k.length>=3&&String(t.phone||'').replace(/\D/g,'').includes(k))).sort((a,b)=>(b.receivedDate||'')>(a.receivedDate||'')?1:-1).slice(0,15);
 $('rrl').innerHTML=L.map(t=>`<div class="rrc" data-c="${t.code}" style="border:1px solid ${rrSel&&rrSel.code===t.code?'var(--ac)':'var(--line)'};border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer"><b>${esc(t.firstName)} ${esc(t.lastName)}</b> · ${esc(t.phone)}<br>${esc(t.model)} ${esc(t.color)} · <small>${esc(t.problem)}</small><br><small>${t.code} · ${t.receivedDate||''} · ${(SM[t.status]||[])[1]||t.status}${t.repairedByName?' · '+esc(t.repairedByName):''}</small></div>`).join('')||'<p style="color:var(--mut)">Nothing to show.</p>';
 $('rrl').querySelectorAll('[data-c]').forEach(d=>d.onclick=()=>{rrSel=tickets.find(t=>t.code===d.dataset.c);const f=$('rrf').elements;f.level.value=num(rrSel.level);f.techId.value=rrSel.repairedBy||rrSel.techId||'';$('rrs').textContent=rrSel.code+' · '+rrSel.model+' · '+rrSel.firstName+' '+rrSel.lastName;$('rrx').style.display='block';$('rrf1').style.display='grid';$('rrb').disabled=false;rrFind()})}
$('rrq').oninput=rrFind;
$('rr').onclick=()=>{rrSel=null;$('rrf').reset();$('rrl').innerHTML='';$('rrx').style.display='none';$('rrf1').style.display='none';$('rrb').disabled=true;$('rrt').innerHTML='<option value="">Unassigned</option>'+techs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('rrd').showModal()};$('rrc').onclick=()=>$('rrd').close();
$('rrf').onsubmit=async e=>{e.preventDefault();if(!rrSel)return;const v=Object.fromEntries(new FormData(e.target)),o=rrSel,A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='RD-';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];
 const tc=techs.find(x=>x.id===v.techId),t={code:c,firstName:o.firstName,lastName:o.lastName,phone:o.phone,model:o.model,color:o.color||'',problem:v.note,status:'received',price:null,receivedDate:today(),estDelivery:v.est||'',level:Number(v.level)||0,techId:v.techId||'',techName:tc?tc.name:'',assignedAt:v.techId?Date.now():null,isReturn:true,returnOf:o.code,returnKind:v.kind,returnNote:v.note,returnAt:Date.now(),origTechId:o.repairedBy||o.techId||'',origTechName:o.repairedByName||o.techName||'',origRepairedAt:o.repairedAt||null};
 try{await setDoc(doc(db,'tickets',c),{...t,history:[{s:'received',t:Date.now()}],createdAt:serverTimestamp()});await sync(t);await updateDoc(doc(db,'tickets',o.code),{returnCodes:arrayUnion(c),updatedAt:serverTimestamp()});logAudit('ticket.return',c+' ← '+o.code+' · '+v.kind);$('rrd').close();print('rc',t)}catch(x){alert('Could not save: '+x.message)}};
// ---- request a part (customer asked, not in stock)
const catalog=async()=>{const [a,b]=await Promise.all([getDocs(collection(db,'parts')),getDocs(collection(db,'products'))]);return [...a.docs.map(d=>({...d.data(),id:d.id,_c:'parts'})),...b.docs.map(d=>({...d.data(),id:d.id,_c:'products'}))]};let CAT=null;
$('rp').onclick=async()=>{$('rpf').reset();$('rpd').showModal();if(!CAT){CAT=await catalog();$('rpl').innerHTML=CAT.map(p=>`<option value="${esc(p.id)} – ${esc(p.name)}">`).join('')}};$('rpc').onclick=()=>$('rpd').close();
$('rpf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),raw=v.item.trim(),p=(CAT||[]).find(x=>x.id===raw.split(' – ')[0].trim());
 try{await setDoc(doc(db,'partNeeds',gen('N')),{sku:p?p.id:'',name:p?p.name:raw,col:p?p._c:'',qty:Math.max(1,Math.floor(num(v.qty))),stock:p?num(p.qty):0,model:v.model,customerName:v.cname,customerPhone:v.cphone,note:v.note,source:'reception',status:'open',requestedBy:user.email,requestedByName:(profile&&profile.name)||user.email,createdAt:serverTimestamp()});logAudit('part.need',(p?p.id:raw)+' · reception');$('rpd').close()}catch(x){alert(x.message)}};
function drawRcv(){$('nf2').innerHTML=rcv.length?`<div style="border-left:6px solid #1e8e4e;margin-bottom:14px;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line)"><b>📦 <span>Requested parts arrived</span> (${rcv.length})</b>`+rcv.map(n=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(n.name)}</b> ×${n.qty} · ${esc(n.customerName||'')} ${esc(n.customerPhone||'')} ${esc(n.model||'')}<div style="margin-top:6px"><button class="p" data-ok="${n.id}">Done</button></div></div>`).join('')+'</div>':'';
 $('nf2').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'partNeeds',b.dataset.ok),{status:'closed',closedAt:Date.now()}))}
// ---- customer declined / return without repair
const NRRl={high_price:'High price',data_loss:"Customer doesn't want to lose data",part_unavailable:'Part unavailable – customer does not want to wait',diagnosis_only:'Customer wants diagnosis only'};let nrT=null;
function openNR(t){nrT=t;$('nrf').reset();$('nrn').textContent=t.code+' · '+t.model;$('nrd').showModal()}$('nrc').onclick=()=>$('nrd').close();
$('nrf').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),t=nrT,it=(t.items||[]).map(i=>i.status==='requested'?{...i,status:'cancelled'}:i);
 try{await updateDoc(doc(db,'tickets',t.code),{status:'no_repair',noRepair:{kind:'customer',reason:v.reason,note:v.note,by:user.email,byName:(profile&&profile.name)||user.email,byId:user.uid,at:Date.now()},pendingQuote:null,items:it,history:arrayUnion({s:'no_repair',t:Date.now()}),updatedAt:serverTimestamp()});await updateDoc(doc(db,'tracking',t.code),{status:'no_repair'});logAudit('ticket.norepair',t.code+' · '+v.reason);$('nrd').close()}catch(x){alert(x.message)}};
function hashAct(n=0){const h=location.hash.slice(1);if(!h)return;if(h==='new')$('nw').click();else if(h==='return')$('rr').click();else if(h==='part')$('rp').click();else if(h.startsWith('edit:')){const t=tickets.find(x=>x.code===h.slice(5));if(!t){if(n<20)setTimeout(()=>hashAct(n+1),300);return}openForm(t)}history.replaceState(null,'',location.pathname+location.search)}
addEventListener('hashchange',()=>hashAct());setTimeout(()=>hashAct(),700);
</script></body></html>
